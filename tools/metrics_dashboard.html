<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Learner Training Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      --window: light-dark(#f5f5f7, #121214);
      --chrome: light-dark(rgba(255, 255, 255, .84), rgba(34, 34, 37, .86));
      --surface: light-dark(#fff, #202023);
      --raised: light-dark(#fbfbfd, #29292d);
      --soft: light-dark(#f0f1f4, #2d2d31);
      --label: light-dark(#1d1d1f, #f5f5f7);
      --secondary: light-dark(#68686d, #aaaab1);
      --separator: light-dark(rgba(60, 60, 67, .16), rgba(235, 235, 245, .14));
      --separator-strong: light-dark(rgba(60, 60, 67, .25), rgba(235, 235, 245, .23));
      --grid: light-dark(rgba(60, 60, 67, .1), rgba(235, 235, 245, .1));
      --blue: light-dark(#007aff, #0a84ff);
      --green: light-dark(#248a3d, #30d158);
      --orange: light-dark(#c93400, #ff9f0a);
      --red: light-dark(#d70015, #ff453a);
      --purple: light-dark(#8944ab, #bf5af2);
      --teal: light-dark(#008299, #64d2ff);
      --pink: light-dark(#d30f45, #ff375f);
      --indigo: light-dark(#3634a3, #5e5ce6);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--window);
      color: var(--label);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--window); color: var(--label); }
    button, select, input { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .app { width: 100%; min-height: 100vh; }
    .titlebar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--separator);
    }
    .title-leading, .brand-line, .pod-head, .toolbar, .toolbar-group,
    .footer, .tag, .live-badge, .pod-state {
      display: flex;
      align-items: center;
    }
    .title-leading { min-width: 0; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      color: #fff;
      background: var(--blue);
      border-radius: 9px;
      font-weight: 600;
    }
    .brand-copy { min-width: 0; }
    .brand-line { align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .product-title, .pod-name, .panel-title, .depth-value { font-weight: 600; }
    .product-context {
      overflow: hidden;
      color: var(--secondary);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .live-badge, .pod-state {
      gap: 6px;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--separator);
      border-radius: 999px;
      white-space: nowrap;
    }
    .live-badge::before, .pod-state::before {
      width: 7px;
      height: 7px;
      content: "";
      background: var(--orange);
      border-radius: 50%;
    }
    .live-badge[data-state="ok"], .pod-state[data-state="ok"] {
      background: light-dark(rgba(52, 199, 89, .1), rgba(48, 209, 88, .12));
      border-color: light-dark(rgba(36, 138, 61, .24), rgba(48, 209, 88, .28));
    }
    .live-badge[data-state="ok"]::before, .pod-state[data-state="ok"]::before { background: var(--green); }
    .live-badge[data-state="bad"]::before, .pod-state[data-state="bad"]::before { background: var(--red); }
    .topology {
      padding: 14px;
      background: var(--chrome);
      border-bottom: 1px solid var(--separator);
    }
    .section-title { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    .pod-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .pod-card {
      min-width: 0;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--separator);
      border-radius: 13px;
    }
    .pod-head { justify-content: space-between; gap: 12px; }
    .pod-identity { display: flex; align-items: center; min-width: 0; gap: 9px; }
    .pod-icon {
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      color: var(--blue);
      background: light-dark(rgba(0, 122, 255, .1), rgba(10, 132, 255, .14));
      border-radius: 9px;
      font-weight: 600;
    }
    .pod-count { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pod-state { min-height: 25px; padding: 3px 8px; color: var(--secondary); }
    .pod-detail {
      margin-top: 8px;
      color: var(--secondary);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .depth-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      background: var(--separator);
      border-bottom: 1px solid var(--separator);
    }
    .depth-item { min-width: 0; padding: 12px 14px; background: var(--surface); }
    .depth-label { color: var(--secondary); }
    .depth-value { margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .depth-item:first-child .depth-value { color: var(--blue); }
    .not-available { color: var(--orange); }
    .toolbar {
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 9px 14px;
      background: var(--chrome);
      border-bottom: 1px solid var(--separator);
    }
    .toolbar-group { flex-wrap: wrap; gap: 7px; }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--secondary);
    }
    .select {
      min-height: 31px;
      padding: 4px 28px 4px 9px;
      color: var(--label);
      background: var(--surface);
      border: 1px solid var(--separator-strong);
      border-radius: 8px;
    }
    .refresh-button {
      min-height: 31px;
      padding: 4px 12px;
      color: var(--label);
      background: var(--surface);
      border: 1px solid var(--separator-strong);
      border-radius: 8px;
      cursor: pointer;
    }
    .refresh-button:hover { border-color: var(--blue); }
    .toolbar-note {
      color: var(--secondary);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px;
      align-items: start;
    }
    .panel {
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--separator);
      border-radius: 13px;
      box-shadow: 0 1px 3px light-dark(rgba(0, 0, 0, .04), rgba(0, 0, 0, .24));
    }
    .panel-head { display: flex; justify-content: space-between; gap: 10px; padding: 12px 13px 9px; }
    .panel-title { margin: 0; font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 38px; padding: 0 13px 10px; }
    .tag, .add-metric {
      min-height: 28px;
      padding: 4px 8px;
      color: var(--secondary);
      background: var(--raised);
      border: 1px solid var(--separator);
      border-radius: 8px;
      cursor: pointer;
    }
    .tag { gap: 6px; }
    .tag[aria-pressed="true"], .add-metric[aria-expanded="true"] {
      color: var(--label);
      border-color: var(--blue);
      background: light-dark(rgba(0, 122, 255, .08), rgba(10, 132, 255, .12));
    }
    .swatch { width: 11px; height: 4px; background: currentColor; border-radius: 999px; }
    .add-metric { display: inline-grid; place-items: center; min-width: 28px; }
    .registry-empty { padding: 5px 7px; color: var(--secondary); }
    .metric-editor { width: min(720px, calc(100vw - 32px)); max-height: 85vh; padding: 0; color: var(--label); background: var(--surface); border: 1px solid var(--separator); border-radius: 13px; }
    .metric-editor::backdrop { background: rgba(0, 0, 0, .3); }
    .editor-head, .editor-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; }
    .editor-head h2 { margin: 0; font-size: 16px; }
    .editor-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 18px 14px; }
    .editor-fields label { display: grid; gap: 6px; color: var(--secondary); }
    .editor-fields input, .editor-fields select { width: 100%; box-sizing: border-box; min-height: 34px; }
    .editor-search { grid-column: 1 / -1; }
    .metric-list { max-height: 42vh; overflow: auto; border-block: 1px solid var(--separator); padding: 6px 18px; }
    .metric-section-title { margin: 12px 0 0; font-size: 12px; color: var(--secondary); }
    .metric-choice { border-bottom: 1px solid var(--separator); padding: 9px 0; }
    .metric-choice:last-child { border-bottom: 0; }
    .metric-choice > label { display: flex; align-items: center; gap: 9px; cursor: pointer; }
    .metric-choice .choice-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .metric-choice .choice-meta { color: var(--secondary); font-size: 12px; }
    .metric-choice details { margin: 6px 0 0 25px; color: var(--secondary); font-size: 12px; }
    .metric-choice summary { cursor: pointer; }
    .metric-choice dl { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 5px 12px; }
    .metric-choice dd { margin: 0; overflow-wrap: anywhere; }
    .editor-footer button:disabled { opacity: .5; cursor: default; }
    .chart-wrap { position: relative; padding: 0 8px 7px; }
    .chart { display: block; width: 100%; overflow: hidden; touch-action: none; }
    .chart-grid { stroke: var(--grid); stroke-width: 1; }
    /* 轴文字随 viewBox 动态计算，字号在各面板宽度下保持一致 */
    .chart-axis { fill: var(--secondary); font-size: 12px; }
    .chart-raw {
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .chart-point { fill: var(--surface); stroke-width: 2.75; vector-effect: non-scaling-stroke; }
    .chart-cursor { stroke: var(--separator-strong); stroke-width: 1; stroke-dasharray: 3 3; }
    .chart-hit { fill: var(--surface); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .empty-chart { fill: var(--secondary); font-size: 14px; }
    .tooltip {
      position: absolute;
      z-index: 2;
      display: grid;
      gap: 3px;
      min-width: 132px;
      max-width: 260px;
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--separator-strong);
      border-radius: 9px;
      box-shadow: 0 4px 14px light-dark(rgba(0, 0, 0, .12), rgba(0, 0, 0, .44));
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .tooltip[hidden] { display: none; }
    .tooltip-time { color: var(--secondary); }
    .tooltip-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tooltip-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .tooltip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tooltip-value { font-weight: 600; white-space: nowrap; }
    .tag-value { color: var(--label); font-variant-numeric: tabular-nums; font-weight: 600; }
    .swatch[data-dash="true"] {
      background: repeating-linear-gradient(
        90deg, currentColor 0 4px, transparent 4px 7px
      );
    }
    .footer {
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 9px 14px;
      color: var(--secondary);
      background: var(--chrome);
      border-top: 1px solid var(--separator);
      font-variant-numeric: tabular-nums;
    }
    .metric-choice a { overflow-wrap: anywhere; }
    @media (max-width: 850px) {
      .pod-grid, .panel-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .titlebar { grid-template-columns: 1fr; }
      .product-context { display: none; }
      .depth-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { align-items: flex-start; }
      .editor-fields { grid-template-columns: 1fr; }
      .metric-choice .choice-meta { max-width: 100px; text-align: right; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="title-leading">
      <div class="brand-mark" aria-hidden="true">RL</div>
      <div class="brand-copy">
        <div class="brand-line">
          <span class="product-title"><span data-i18n="Training Monitor">Training Monitor</span></span>
          <span id="run-context" class="product-context">Learner / 等待训练实例</span>
        </div>
      </div>
    </div>
    <div class="toolbar-group"><select id="language" class="select" aria-label="Language / 语言"><option value="zh">中文</option><option value="en">English</option></select>
    <span id="live-status" class="live-badge" data-state="wait">Connecting</span></div>
  </header>

  <section class="topology" data-i18n-aria="Training Topology" aria-label="Training Topology">
    <h1 class="section-title"><span data-i18n="Topology">Topology</span></h1>
    <div class="pod-grid">
      <article class="pod-card" aria-label="Learner Pod">
        <div class="pod-head">
          <div class="pod-identity"><span class="pod-icon" aria-hidden="true">L</span><span class="pod-name">Learner Pod</span></div>
          <div><span id="learner-count" class="pod-count">— / 1</span> <span id="learner-state" class="pod-state" data-state="wait">等待</span></div>
        </div>
      </article>
      <article class="pod-card" data-i18n-aria="Server Pod (AIServer + Client)" aria-label="Server Pod (AIServer + Client)">
        <div class="pod-head">
          <div class="pod-identity"><span class="pod-icon" aria-hidden="true">S</span><span class="pod-name">Server Pod</span></div>
          <div><span id="server-count" class="pod-count">— / 1</span> <span id="server-state" class="pod-state" data-state="wait">等待</span></div>
        </div>
        <div id="server-model-sync" class="pod-detail">等待模型信息</div>
      </article>
    </div>
  </section>

  <section class="depth-strip" data-i18n-aria="Training Status" aria-label="Training Status">
    <div class="depth-item"><div class="depth-label">Model Step</div><div id="model-step" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Train Update</div><div id="train-update" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Trained Transitions</div><div id="trained-samples" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Produced Transitions</div><div id="produced-samples" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Workload</div><div id="training-workload" class="depth-value">Training</div></div>
  </section>

  <section class="toolbar" data-i18n-aria="Chart Controls" aria-label="Chart Controls">
    <div class="toolbar-group">
      <label class="toggle"><span data-i18n="Time range">Time range</span>
        <select id="time-range" class="select" data-i18n-aria="Time range" aria-label="Time range"></select>
      </label>
      <label class="toggle"><span data-i18n="Auto refresh">Auto refresh</span>
        <select id="refresh-interval" class="select" data-i18n-aria="Refresh interval" aria-label="Refresh interval"></select>
      </label>
    </div>
    <div class="toolbar-group">
      <span class="toolbar-note" data-i18n="Mean window: 1 min">Mean window: 1 min</span>
      <button id="create-panel" type="button" class="refresh-button"><span data-i18n="＋ Create panel">＋ Create panel</span></button>
      <button id="reset-panels" type="button" class="refresh-button"><span data-i18n="Restore defaults">Restore defaults</span></button>
      <button id="refresh-now" type="button" class="refresh-button"><span data-i18n="Refresh now">Refresh now</span></button>
      <span id="history-status" class="toolbar-note" role="status"></span>
      <span id="layout-status" class="toolbar-note" role="status"></span>
    </div>
  </section>

  <main id="panel-grid" class="panel-grid" data-i18n-aria="Training Metrics" aria-label="Training Metrics"></main>

  <footer class="footer">
    <span id="stream-status">指标流：等待连接</span>
    <span id="last-refresh">尚未刷新</span>
  </footer>
</div>

<dialog id="metric-editor" class="metric-editor" aria-labelledby="editor-title">
  <form id="panel-form">
    <div class="editor-head"><h2 id="editor-title"><span data-i18n="Create panel">Create panel</span></h2><button id="close-editor" type="button" class="refresh-button" data-i18n-aria="Close field selector" aria-label="Close field selector"><span data-i18n="Close">Close</span></button></div>
    <div class="editor-fields">
      <label><span data-i18n="Panel name">Panel name</span><input id="panel-name" class="select" required maxlength="80" data-i18n-placeholder="e.g. Advantage / Value" placeholder="e.g. Advantage / Value"></label>
      <label><span data-i18n="Filter by category">Filter by category</span><select id="metric-category" class="select"></select></label>
      <label class="editor-search"><span data-i18n="Search fields">Search fields</span><input id="metric-search" class="select" type="search" data-i18n-placeholder="Name or field, e.g. loss, success, task.…" placeholder="Name or field, e.g. loss, success, task.…"></label>
    </div>
    <p id="metric-collection-status" class="registry-empty" role="status" hidden></p>
    <div id="metric-list" class="metric-list" data-i18n-aria="Available fields" aria-label="Available fields"></div>
    <div class="editor-footer"><span id="selected-count" class="toolbar-note" role="status"></span><button id="save-panel" class="refresh-button" type="submit"><span data-i18n="Create panel">Create panel</span></button></div>
  </form>
</dialog>

    });
  };

  const hideTooltip = panel => {
    const tooltip = panel.querySelector(".tooltip");
    if (tooltip) tooltip.hidden = true;
    panel.querySelectorAll(".chart-cursor, .chart-hit").forEach(
      element => element.remove()
    );
  };
  // 就近命中：按指针 x 反解时间，再在各序列内二分查找最接近的样本点。
  const nearestPoint = (points, timestamp) => {
    let low = 0;
    let high = points.length - 1;
    while (low < high) {
      const middle = (low + high) >> 1;
      if (points[middle].timestamp < timestamp) low = middle + 1;
      else high = middle;
    }
    const candidate = points[low];
    const previous = points[low - 1];
    if (!previous) return candidate;
    return Math.abs(previous.timestamp - timestamp) <=
      Math.abs(candidate.timestamp - timestamp) ? previous : candidate;
  };
  const showTooltip = (group, event) => {
    const panel = document.querySelector(`[data-group="${group.id}"]`);
    const cached = hoverState.get(group.id);
    if (!panel || !cached) return;
    const svg = panel.querySelector("svg");
    const tooltip = panel.querySelector(".tooltip");
    const {geometry, domain, span} = cached;
    const bounds = svg.getBoundingClientRect();
    if (!bounds.width) return;
    const scale = geometry.width / bounds.width;
    const x = (event.clientX - bounds.left) * scale;
    if (x < geometry.left || x > geometry.width - geometry.right) {
      hideTooltip(panel);
      return;
    }
    const timestamp = domain.minimum +
      (x - geometry.left) / geometry.chartWidth * span;
    panel.querySelectorAll(".chart-cursor, .chart-hit").forEach(
      element => element.remove()
    );
    const rows = [];
    cached.series.forEach(item => {
      const point = nearestPoint(item.points, timestamp);
      if (!point) return;
      rows.push({metric: item.metric, style: item.style, point});
      svg.appendChild(svgElement("circle", {
        cx: cached.xFor(point.timestamp),
        cy: cached.yFor(point.value),
        r: 3.5, class: "chart-hit", stroke: `var(${item.style.color})`
      }));
    });
    if (!rows.length) {
      hideTooltip(panel);
      return;
    }
    const cursorX = cached.xFor(rows[0].point.timestamp);
    svg.insertBefore(svgElement("line", {
      x1: cursorX, y1: geometry.top, x2: cursorX,
      y2: geometry.top + geometry.chartHeight, class: "chart-cursor"
    }), svg.firstChild);
    tooltip.replaceChildren();
    const time = document.createElement("div");
    time.className = "tooltip-time";
    time.textContent = new Date(rows[0].point.timestamp * 1000)
      .toLocaleTimeString(locale());
    tooltip.appendChild(time);
    rows.forEach(row => {
      const line = document.createElement("div");
      line.className = "tooltip-row";
      const name = document.createElement("span");
      name.className = "tooltip-name";
      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.color = `var(${row.style.color})`;
      if (row.style.dash) swatch.dataset.dash = "true";
      const label = document.createElement("span");
      label.className = "tooltip-label";
      label.textContent = fieldLabel(row.metric);
      name.append(swatch, label);
      const value = document.createElement("span");
      value.className = "tooltip-value";
      value.textContent = formatMetric(row.metric, row.point.value);
      line.append(name, value);
      tooltip.appendChild(line);
    });
    tooltip.hidden = false;
    const wrap = panel.querySelector(".chart-wrap");
    const localX = cursorX / scale + 14;
    const maximumX = wrap.clientWidth - tooltip.offsetWidth - 8;
    tooltip.style.left = `${Math.max(8, Math.min(localX, maximumX))}px`;
    tooltip.style.top = "12px";
  };

  // viewBox 宽度跟随容器实际像素宽度，使 1 用户单位等于 1 CSS 像素，
  // 轴文字字号在单列与双列布局下保持一致，不再随面板宽度缩放。
  const chartGeometry = panel => {
    const wrap = panel.querySelector(".chart-wrap");
    const measured = Math.round(wrap?.clientWidth || 0) - 16;
    const width = Math.max(320, measured > 0 ? measured : 664);
    return {
      width,
      height: CHART_HEIGHT,
      ...CHART_MARGIN,
      chartWidth: width - CHART_MARGIN.left - CHART_MARGIN.right,
      chartHeight: CHART_HEIGHT - CHART_MARGIN.top - CHART_MARGIN.bottom
    };
  };

  const renderPanel = (group, context) => {
    const panel = document.querySelector(`[data-group="${group.id}"]`);
    if (!panel) return;
    const svg = panel.querySelector("svg");
    svg.replaceChildren();
    const domain = context.domain;
    const selected = state.focus[group.id];
    const keys = resolvedKeys(group);
    applyLegendValues(group, context.records);
    panel.dataset.focus = selected || "";
    svg.setAttribute("aria-label", t("{title} chart, x-axis Wall Time", {title: group.title}));

    const geometry = chartGeometry(panel);
    const {width, height, left, right, top, chartWidth, chartHeight} = geometry;
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("height", String(height));
    hoverState.delete(group.id);

    if (!domain || !keys.length) {
      delete panel.dataset.yMin;
      delete panel.dataset.yMax;
      appendText(svg, width / 2, height / 2,
        t(keys.length ? "No data in the selected range" : "Selected fields unavailable"), "middle", "empty-chart");
      return;
    }
    const span = domain.maximum - domain.minimum;
    const visibleRecords = context.records.filter(record => {
      const timestamp = finiteNumber(record.timestamp);
      return timestamp !== null &&
        timestamp >= domain.minimum && timestamp <= domain.maximum;
    });
    const series = keys.map(fieldId => {
      const metric = registry.get(fieldId);
      const points = visibleRecords.map(record => ({
        timestamp: finiteNumber(record.timestamp),
        value: metricValue(record, fieldId)
      })).filter(point => point.timestamp !== null && point.value !== null);
      return {metric, style: styleFor(group, fieldId), points};
    }).filter(item => item.metric && item.points.length);
    if (!series.length || !(span > 0)) {
      delete panel.dataset.yMin;
      delete panel.dataset.yMax;
      appendText(
        svg, width / 2, height / 2, t("No data in the selected range"), "middle", "empty-chart"
      );
      return;
    }

    const rawValues = series.flatMap(item => item.points.map(point => point.value));
    const [minimum, maximum] = stableDomain(
      group, keys, series[0].metric, rawValues
    );
    panel.dataset.yMin = String(minimum);
    panel.dataset.yMax = String(maximum);
    const yFor = value => top + (maximum - value) / (maximum - minimum) * chartHeight;
    const xFor = timestamp => {
      const ratio = Math.max(
        0,
        Math.min(1, (timestamp - domain.minimum) / span)
      );
      return left + ratio * chartWidth;
    };
    const axisMetric = series[0].metric;

    for (let tick = 0; tick < 5; tick += 1) {
      const ratio = tick / 4;
      const y = top + ratio * chartHeight;
      svg.appendChild(svgElement("line", {
        x1: left, y1: y, x2: width - right, y2: y, class: "chart-grid"
      }));
      appendText(
        svg,
        left - 8,
        y + 4,
        formatMetric(axisMetric, maximum - ratio * (maximum - minimum)),
        "end"
      );
    }
    const tickStep = tickStepFor(span);
    const firstTick = Math.ceil(domain.minimum / tickStep) * tickStep;
    for (let tickTime = firstTick; tickTime <= domain.maximum; tickTime += tickStep) {
      const x = xFor(tickTime);
      svg.appendChild(svgElement("line", {
        x1: x, y1: top, x2: x, y2: top + chartHeight, class: "chart-grid"
      }));
      appendText(
        svg,
        x,
        height - 12,
        formatTickTime(tickTime, span),
        x < left + 26 ? "start" : x > width - right - 26 ? "end" : "middle"
      );
    }

    const clipId = `plot-${group.id}`;
    const defs = svgElement("defs");
    const clipPath = svgElement("clipPath", {id: clipId});
    clipPath.appendChild(svgElement("rect", {
      x: left, y: top, width: chartWidth, height: chartHeight
    }));
    defs.appendChild(clipPath);
    svg.appendChild(defs);
    series.forEach(item => {
      const pixelPoints = item.points.map(point => ({
        x: xFor(point.timestamp),
        y: yFor(point.value)
      }));
      const color = `var(${item.style.color})`;
      const dashArray = dashArrayFor(item.style);
      const attributes = {
        d: pathFor(decimatePoints(pixelPoints, left, chartWidth)),
        class: "chart-raw", stroke: color,
        "clip-path": `url(#${clipId})`
      };
      if (dashArray) attributes["stroke-dasharray"] = dashArray;
      svg.appendChild(svgElement("path", attributes));
      const latest = pixelPoints[pixelPoints.length - 1];
      svg.appendChild(svgElement("circle", {
        cx: latest.x, cy: latest.y, r: 4.5, class: "chart-point",
        stroke: color, "clip-path": `url(#${clipId})`
      }));
    });
    // 缓存几何与序列供 crosshair 命中查询，避免每次指针移动重算数据。
    hoverState.set(group.id, {geometry, domain, span, series, xFor, yFor});
  };

  const buildRenderContext = () => {
    const records = combinedRecords();
    return {records, domain: currentDomain(records)};
  };
  const renderAllPanels = () => {
    const context = buildRenderContext();
    groups.forEach(group => renderPanel(group, context));
  };
  const renderGroup = group => renderPanel(group, buildRenderContext());
  const isRequired = (group, metric) => !!group &&
    (group.required || []).some(selector => matchesMetric(selector, metric));
  const updateSelectedCount = () => {
    byId("selected-count").textContent = t("{count} fields selected", {count: selectedFields.size});
    byId("save-panel").disabled = selectedFields.size === 0;
  };
  const metricDetails = metric => {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = t("Field details");
    details.appendChild(summary);
    if (metric.description) {
      const description = document.createElement("p");
      description.textContent = metric.description;
      details.appendChild(description);
    }
    const aggregationNames = {mean: "Weighted Mean (sum / count)", sum: "Sum", min: "Min", max: "Max", latest: "Latest", weighted_mean: "Weighted Mean", not_mergeable: "Producer statistic"};
    const aggregation = metric.aggregation_kind || metric.statistic;
    const values = [
      ["Field", metric.field_id],
      ["Unit", metric.unit],
      ["Display unit", metric.display_unit || metric.unit],
      ["Aggregation", aggregationNames[aggregation] || aggregation],
      ["Scope", metric.scope],
      ["Denominator", metric.denominator || "N/A"],
      ["Window", metric.window_kind === "1m" ? "Trailing 1 min of reports" :
        metric.window_kind === "latest_metric_event" ? "Latest update" : metric.window_kind],
      ["Source", metric.source_instance || metric.owner_component]
    ];
    const list = document.createElement("dl");
    values.forEach(([label, value]) => {
      if (value === undefined) return;
      const key = document.createElement("dt");
      key.textContent = label;
      const text = document.createElement("dd");
      text.textContent = String(value);
      list.append(key, text);
    });
    details.appendChild(list);
    const query = new URLSearchParams({field: metric.field_id, window: EVENT_WINDOW});
    const command = document.createElement("a");
    command.href = `/api/metrics/query?${query}`;
    command.target = "_blank";
    command.rel = "noopener";
    command.textContent = t("Read field data") + ` · GET ${command.getAttribute("href")}`;
    details.appendChild(command);
    return details;
  };
  const renderMetricChoices = () => {
    const list = byId("metric-list");
    list.replaceChildren();
    const category = byId("metric-category").value;
    const query = byId("metric-search").value.trim().toLocaleLowerCase();
    const rewardSection = metric => metric.group === "reward"
      ? metric.denominator || "" : null;
    const sectionOrder = metric => {
      const section = rewardSection(metric);
      return section === null ? 0 : section === "transition" ? 1 : section === "agent_episode" ? 2 : 3;
    };
    const candidates = [...registry.values()].filter(metric =>
      (!category || metric.group === category) &&
      (!query || [metric.label, metric.field_id, metric.metric_id, metric.series_id, metric.source_label]
        .filter(Boolean).join(" ").toLocaleLowerCase().includes(query))
    ).sort((a, b) => sectionOrder(a) - sectionOrder(b) ||
      (rewardSection(a) || "").localeCompare(rewardSection(b) || "") ||
      Number(selectedFields.has(b.series_id)) - Number(selectedFields.has(a.series_id)));
    let previousSection = null;
    candidates.forEach(metric => {
      const section = rewardSection(metric);
      if (section !== null && section !== previousSection) {
        const heading = document.createElement("h3");
        heading.className = "metric-section-title";
        const title = {transition: "Per Transition", agent_episode: "Per Agent Episode"}[section]
          || section || "Other Reward Fields";
        heading.textContent = category === "reward" ? title : `Reward · ${title}`;
        list.appendChild(heading);
      }
      previousSection = section;
      const row = document.createElement("div");
      row.className = "metric-choice";
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = selectedFields.has(metric.series_id);
      checkbox.disabled = isRequired(editingGroup, metric);
      checkbox.setAttribute("aria-label", fieldLabel(metric));
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) selectedFields.add(metric.series_id);
        else selectedFields.delete(metric.series_id);
        updateSelectedCount();
      });
      const name = document.createElement("span");
      name.className = "choice-label";
      name.textContent = fieldLabel(metric);
      const metadata = document.createElement("span");
      metadata.className = "choice-meta";
      metadata.textContent = [metric.display_unit || metric.unit,
        metric.source_label, checkbox.disabled ? t("Required") : ""].filter(Boolean).join(" · ");
      label.append(checkbox, name, metadata);
      row.append(label, metricDetails(metric));
      list.appendChild(row);
    });
    // A missing field does not prove a missing registration; retain the selection.
    [...selectedFields].filter(id => !registry.has(id)).forEach(selector => {
      const row = document.createElement("div");
      row.className = "metric-choice";
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = true;
      checkbox.disabled = (editingGroup?.required || []).includes(selector);
      const text = document.createElement("span");
      text.className = "choice-label";
      const name = selector.startsWith("registered/")
        ? decodeURIComponent(selector.split("/").pop()) : selector;
      text.textContent = t("{name} · Field unavailable", {name: name});
      checkbox.addEventListener("change", () => {
        selectedFields.delete(selector);
        renderMetricChoices();
      });
      label.append(checkbox, text);
      row.appendChild(label);
      list.appendChild(row);
    });
    if (!candidates.length) {
      const empty = document.createElement("p");
      empty.className = "registry-empty";
      empty.textContent = t("No matching fields");
      list.appendChild(empty);
    }
    updateSelectedCount();
  };
  const openEditor = group => {
    editingGroup = group;
    selectedFields = new Set(group?.keys || []);
    [...(group?.required || []), ...(group?.selections || [])].forEach(selector => {
      if (![...registry.values()].some(metric => matchesMetric(selector, metric))) {
        selectedFields.add(selector);
      }
    });
    byId("editor-title").textContent = group ? t("Edit panel · {title}", {title: group.title}) : t("Create panel");
    byId("save-panel").textContent = group ? t("Save panel") : t("Create panel");
    byId("panel-name").value = group?.title || "";
    byId("metric-search").value = "";
    const select = byId("metric-category");
    select.replaceChildren();
    [{id: "", label: "All fields"}, ...categories].forEach(category => {
      const option = document.createElement("option");
      option.value = category.id;
      option.textContent = t(category.label);
      select.appendChild(option);
    });
    // A panel's category organizes the dashboard; it does not restrict which
    // registered fields can be added to that panel.
    select.value = "";
    renderCollectionStatus(state.latest);
    renderMetricChoices();
    byId("metric-editor").showModal();
  };

  function refreshPanelControls(group) {
    const panel = document.querySelector(`[data-group="${group.id}"]`);
    if (!panel) return;
    normalizeFocus(group);
    const tags = panel.querySelector(".tags");
    // 仅在标签集合发生结构变化时重建 DOM；每轮轮询无条件重建会丢失键盘焦点、
    // 重置候选列表的展开状态，并让图例数值闪烁。
    const signature = `${language}:${
      groupSupportsAll(group) ? (isUniformGroup(group) ? "all|" : "same|") : ""
    }${group.keys.map(id => `${id}:${fieldLabel(registry.get(id))}`).join(",")}`;
    if (tags.dataset.signature !== signature) {
      tags.replaceChildren();
      const addTag = (fieldId, label, style) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tag";
        button.dataset.metric = fieldId;
        button.setAttribute(
          "aria-label",
          fieldId === "all"
            ? t("Show all {title} curves with the same unit", {title: group.title})
            : t("Focus {label} in {title}", {title: group.title, label: label})
        );
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.color = style.color;
        if (style.dash) swatch.dataset.dash = "true";
        const text = document.createElement("span");
        text.textContent = label;
        const value = document.createElement("span");
        value.className = "tag-value";
        button.append(swatch, text, value);
        button.addEventListener("click", () => {
          group.focusChosen = true;
          state.focus[group.id] = fieldId;
          // 记录锚点量纲，使聚合视图显示与该指标同量纲的曲线。
          if (fieldId !== "all") state.anchor[group.id] = fieldId;
          refreshPanelControls(group);
          renderGroup(group);
        });
        tags.appendChild(button);
      };
      if (groupSupportsAll(group)) {
        addTag(
          "all",
          isUniformGroup(group) ? t("All") : t("Same unit"),
          {color: "var(--secondary)", dash: false}
        );
      }
      group.keys.forEach(fieldId => {
        const metric = registry.get(fieldId);
        if (!metric) return;
        const style = styleFor(group, fieldId);
        addTag(fieldId, fieldLabel(metric), {
          color: `var(${style.color})`,
          dash: style.dash
        });
      });

      const add = document.createElement("button");
      add.type = "button";
      add.className = "add-metric";
      add.textContent = t("＋ Fields");
      add.setAttribute("aria-label", t("Add fields to {title}", {title: group.title}));
      add.addEventListener("click", () => openEditor(group));
      tags.appendChild(add);
      tags.dataset.signature = signature;
    }
    tags.querySelectorAll(".tag[data-metric]").forEach(tag => {
      tag.setAttribute(
        "aria-pressed",
        String(state.focus[group.id] === tag.dataset.metric)
      );
    });
  }

  const buildPanels = () => {
    const grid = byId("panel-grid");
    grid.replaceChildren();
    groups.forEach(group => {
      const panel = document.createElement("section");
      panel.className = "panel";
      panel.dataset.group = group.id;
      panel.setAttribute("aria-label", t("{title} panel", {title: group.title}));
      const head = document.createElement("div");
      head.className = "panel-head";
      const title = document.createElement("h2");
      title.className = "panel-title";
      title.textContent = group.title;
      head.appendChild(title);
      if (group.custom) {
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "refresh-button";
        remove.textContent = t("Remove");
        remove.setAttribute("aria-label", t("Remove panel {title}", {title: group.title}));
        remove.addEventListener("click", () => {
          groups.splice(groups.indexOf(group), 1);
          groupById.delete(group.id);
          hoverState.delete(group.id);
          panel.remove();
          saveLayout();
        });
        head.appendChild(remove);
      }
      const tags = document.createElement("div");
      tags.className = "tags";
      tags.setAttribute("aria-label", t("{title} chart tabs", {title: group.title}));
      const wrap = document.createElement("div");
      wrap.className = "chart-wrap";
      const chart = svgElement("svg", {
        class: "chart", viewBox: `0 0 664 ${CHART_HEIGHT}`, role: "img"
      });
      const tooltip = document.createElement("div");
      tooltip.className = "tooltip";
      tooltip.hidden = true;
      tooltip.setAttribute("role", "tooltip");
      wrap.append(chart, tooltip);
      chart.addEventListener("pointermove", event => showTooltip(group, event));
      chart.addEventListener("pointerleave", () => hideTooltip(panel));
      panel.append(head, tags, wrap);
      grid.appendChild(panel);
      refreshPanelControls(group);
      renderGroup(group);
    });
  };

  const resetStream = sourceId => {
    state.records = [];
    state.cursor = 0;
    state.sourceId = sourceId || "";
    state.domains.clear();
    state.catalogFetchedAt = 0;
    state.historyRecords = [];
    state.historyRange = "";
    state.historyFetchedAt = 0;
    state.historyCursor = 0;
    state.historyFields = "";
    renderAllPanels();
  };
  // 关闭自动刷新后画面会停在最后一次拉取的数据上，
  // 必须显式提示，否则容易被误读为训练已停止。
  const updateRefreshNote = (event) => {
    const suffix = state.refreshMs > 0 ? "" : t(" · Auto refresh is off");
    if (event) {
      state.lastRefreshAt = new Date();
      state.lastRefreshEvent = event;
    }
    byId("last-refresh").textContent = (state.lastRefreshAt
      ? t(state.lastRefreshEvent, {time: state.lastRefreshAt.toLocaleTimeString(locale())})
      : t("Not refreshed yet")) + suffix;
  };
  // 当前所有面板追踪的字段并集：历史端点按此裁剪响应，
  // 未裁剪时单次 24h 响应可达 20MB 量级。
  const trackedFieldSignature = () => [...new Set(
    groups.flatMap(group => group.keys)
  )].sort().join(",");
  // 6h/24h/all 大范围切换到服务端粗粒度历史层；服务端无该端点时降级为仅保留段。
  const loadHistory = async force => {
    if (!HISTORY_RANGES.has(state.timeRange)) {
      state.historyRecords = [];
      state.historyRange = "";
      state.historyCursor = 0;
      byId("history-status").textContent = "";
      return;
    }
    const fields = trackedFieldSignature();
    if (!fields) return;
    // 范围或字段集变化必须整段重取，否则只按游标增量追加。
    const reload = force || state.historyRange !== state.timeRange ||
      state.historyFields !== fields;
    if (!reload && state.historyCursor === 0) return;
    const afterSequence = reload ? 0 : state.historyCursor;
    try {
      const response = await fetch(
        `/api/metrics/history?range=${encodeURIComponent(state.timeRange)}` +
        `&fields=${encodeURIComponent(fields)}` +
        `&after_sequence=${encodeURIComponent(afterSequence)}`,
        {cache: "no-store"}
      );
      if (!response.ok) throw new Error(`history HTTP ${response.status}`);
      const document = await response.json();
      const fetched = (document.records || []).filter(
        record => record.metrics_source_id === state.sourceId
      );
      state.historyRecords = reload
        ? fetched
        : state.historyRecords.concat(fetched);
      const newest = state.historyRecords[state.historyRecords.length - 1];
      state.historyCursor = newest ? Number(newest.sequence) || 0 : 0;
      state.historyRange = state.timeRange;
      state.historyFields = fields;
      state.historyFetchedAt = Date.now();
      state.historyAvailable = true;
      byId("history-status").textContent = state.historyRecords.length
        ? t("History points: {count}", {count: formatInteger(state.historyRecords.length)})
        : t("No history yet");
    } catch (error) {
      state.historyAvailable = false;
      state.historyRecords = [];
      state.historyRange = "";
      state.historyCursor = 0;
      byId("history-status").textContent = t("History unavailable; showing retained data");
    }
  };
  const ingest = records => {
    if (!Array.isArray(records) || !records.length) return;
    records = records.filter(
      record => record.metrics_source_id === state.sourceId
    );
    if (!records.length) return;
    const bySequence = new Map(
      state.records.map(record => [
        Number(record.sequence),
        record
      ])
    );
    records.forEach(record => {
      const sequence = Number(record.sequence);
      if (sequence > 0) bySequence.set(sequence, record);
    });
    state.records = [...bySequence.values()].sort(
      (left, right) =>
        Number(left.sequence) - Number(right.sequence)
    ).slice(-state.recordLimit);
    const latest = state.records[state.records.length - 1];
    state.cursor = latest
      ? Number(latest.sequence)
      : 0;
  };
  const collectionIssue = record => {
    const relayState = record?.metric_events?.aiserver_relay?.state;
    if (["rejected", "failed", "unavailable"].includes(relayState)) {
      return "AIServer metrics unavailable";
    }
    if (["projection_error", "incomplete", "unavailable"].includes(record?.metric_event_views?.status)) {
      return "Metric data incomplete";
    }
    return ["starting", "waiting"].includes(relayState) ? "Waiting for AIServer metrics" : "";
  };
  const renderCollectionStatus = record => {
    const issue = collectionIssue(record);
    const message = byId("metric-collection-status");
    message.hidden = !issue;
    message.textContent = issue ? t(issue) : "";
    message.title = record?.metric_events?.aiserver_relay?.last_error || "";
  };
  const renderStatus = (status, record) => {
    const mode = status?.mode;
    byId("training-workload").textContent = mode ? mode[0].toUpperCase() + mode.slice(1) : "—";
    const actor = record?.actor || {};
    const metricsAvailable = finiteNumber(status?.latest_sequence) !== null;
    const learnerConnected = status?.service === "learner-metrics" && metricsAvailable;
    const stale = status?.stale === true;
    const freshnessUnavailable = status?.stale === null || status?.stale === undefined;
    const serverPresent = Boolean(actor.instance_id);
    const clientConnected = actor.client_session_recent === true;
    const activeModelStep = finiteNumber(actor?.model_identity?.model_step);
    const stagedModelStep = finiteNumber(
      actor?.staged_model_identity?.model_step
    );
    const latestModelStep = finiteNumber(
      record?.model?.latest_available_model_step ??
      record?.model?.latest_model_identity?.model_step ??
      record?.learner?.model_step
    );
    const hasActiveModel = Boolean(actor?.model_identity?.model_lineage_id) &&
      activeModelStep !== null;
    const lifecycleReady = actor.state === "AISERVER_STATE_READY" ||
      (!actor.state && actor.ready === true);
    const projectedServerReady = record?.chain?.server_pod?.ready;
    const serverReady = serverPresent && (
      projectedServerReady === true ||
      (projectedServerReady === undefined && lifecycleReady &&
        !actor.error && clientConnected && hasActiveModel)
    );
    byId("learner-count").textContent = learnerConnected ? "1 / 1" : "— / 1";
    byId("server-count").textContent = !metricsAvailable
      ? "— / 1"
      : serverPresent ? "1 / 1" : "0 / 1";
    setStatus(
      byId("learner-state"),
      !learnerConnected ? t("Metrics unavailable") : freshnessUnavailable ? t("Freshness unknown") : stale ? t("Waiting for metrics") : t("Running"),
      !learnerConnected ? "bad" : freshnessUnavailable || stale ? "wait" : "ok"
    );
    setStatus(
      byId("server-state"),
      serverReady ? t("Running") :
        stale && actor.instance_id ? t("Stale state") :
        actor.error ? t("Error") :
        !serverPresent ? t("Disconnected") :
        actor.state === "AISERVER_STATE_DRAINING" ? t("Stopping") :
        actor.state === "AISERVER_STATE_STOPPED" ? t("Stopped") :
        !hasActiveModel ? t("Syncing model") :
        !clientConnected ? t("Waiting for Client") : t("Starting"),
      serverReady ? "ok" : actor.error ? "bad" : "wait"
    );
    let modelSyncText = t("Waiting for model information");
    if (!serverPresent) {
      modelSyncText = t("Waiting for AIServer and Client");
    } else if (!hasActiveModel) {
      modelSyncText = t("Waiting for the first model");
    } else if (latestModelStep === null) {
      modelSyncText = t("Active step {step}", {step: formatInteger(activeModelStep)});
    } else if (activeModelStep < latestModelStep) {
      const staged = stagedModelStep !== null &&
        stagedModelStep > activeModelStep
        ? t(" · Staged step {step}", {step: formatInteger(stagedModelStep)})
        : "";
      modelSyncText = t("Active step {step}", {step: formatInteger(activeModelStep)}) + staged +
        t(" · Latest step {step}", {step: formatInteger(latestModelStep)}) +
        t(" · Lag {steps}", {steps: formatInteger(latestModelStep - activeModelStep)});
    } else if (activeModelStep === latestModelStep) {
      modelSyncText = t("Active step {step} · Synced", {step: formatInteger(activeModelStep)});
    } else {
      modelSyncText = t("Active step {step} · Distribution status pending", {step: formatInteger(activeModelStep)});
    }
    const feedback = record?.actor?.model_feedback;
    if (feedback?.last_error) {
      modelSyncText += t(" · Update failed [{stage}]: {error}", {stage: feedback.stage, error: feedback.last_error});
    }
    byId("server-model-sync").textContent = modelSyncText;
    const issue = collectionIssue(record);
    renderCollectionStatus(record);
    setStatus(
      byId("live-status"),
      !learnerConnected ? t("Connection failed") :
        freshnessUnavailable ? t("Metric freshness unavailable") :
        stale ? t("Metrics stale") : issue ? t(issue) : t("Live"),
      !learnerConnected ? "bad" : freshnessUnavailable || stale || issue ? "wait" : "ok"
    );
    byId("run-context").textContent =
      `Learner / ${status?.metrics_source_id || t("Waiting for a training instance")}`;
    const eventViewStatus = record?.metric_event_views?.status;
    const projectionErrors = Object.values(record?.metric_event_views?.sources || {})
      .filter(source => source.last_error)
      .map(source => `${source.instance_id} #${source.last_error.event_sequence}: ${source.last_error.message}`);
    const relay = record?.metric_events?.aiserver_relay;
    const eventNote = eventViewStatus === "projection_error"
      ? t(" · Metric projection failed: ") + projectionErrors.join("; ")
      : eventViewStatus === "incomplete" ? t(" · Metric history incomplete")
      : eventViewStatus === "unavailable" ? t(" · Event history unavailable") : "";
    byId("stream-status").textContent =
      t("Metric stream: {stream} · ", {stream: status?.stream || "—"}) +
      `stale=${status?.stale_status || "unavailable"} · ` +
      `sequence ${formatInteger(status?.latest_sequence)}` + eventNote +
      (["rejected", "failed", "unavailable"].includes(relay?.state) ? t(" · Metric relay {state}: {error}", {state: relay.state, error: relay.last_error}) : "");
  };
  const renderSummary = record => {
    const modelStep = metricValue(record, MODEL_STEP_ID);
    const trainUpdate = metricValue(record, TRAIN_UPDATE_ID);
    const trainedSamples = metricValue(record, TRAINED_SAMPLES_ID);
    const producedSamples = metricValue(record, PRODUCED_SAMPLES_ID);
    byId("model-step").textContent = formatInteger(modelStep);
    byId("train-update").textContent = formatInteger(trainUpdate);
    byId("trained-samples").textContent = formatInteger(trainedSamples);
    byId("produced-samples").textContent =
      formatInteger(producedSamples);
  };

  const poll = async () => {
    if (state.polling) return;
    state.polling = true;
    try {
      const statusResponse = await fetch("/api/status", {cache: "no-store"});
      if (!statusResponse.ok) {
        throw new Error(`status HTTP ${statusResponse.status}`);
      }
      const status = await statusResponse.json();
      const retainedRecordLimit = Number(status.retained_record_limit);
      if (Number.isInteger(retainedRecordLimit) && retainedRecordLimit > 0) {
        state.recordLimit = retainedRecordLimit;
        state.records = state.records.slice(-state.recordLimit);
      }
      const sourceChanged = state.sourceId !== status.metrics_source_id;
      if (sourceChanged) resetStream(status.metrics_source_id);
      await refreshCatalog(sourceChanged || registry.size === 0);
      const fields = [...new Set([
        ...groups.flatMap(group => group.keys.map(id => registry.get(id).field_id)),
        MODEL_STEP_ID, TRAIN_UPDATE_ID, TRAINED_SAMPLES_ID, PRODUCED_SAMPLES_ID
      ])].sort();
      const signature = JSON.stringify(fields);
      const after = signature === state.queriedFields ? state.cursor : 0;
      const query = new URLSearchParams({after_sequence: String(after), window: EVENT_WINDOW});
      fields.forEach(field => query.append("field", field));
      const metricsResponse = await fetch(`/api/metrics/query?${query}`, {cache: "no-store"});
      if (!metricsResponse.ok) {
        throw new Error(`metrics HTTP ${metricsResponse.status}`);
      }
      const document = await metricsResponse.json();
      ingest(document.records || []);
      state.queriedFields = signature;
      state.latest = document.latest || {};
      if (HISTORY_RANGES.has(state.timeRange)) {
        const historyStale = Date.now() - state.historyFetchedAt > 60000;
        if (state.historyRange !== state.timeRange || historyStale) {
          await loadHistory(true);
        }
      }
      state.status = status;
      const latest = state.latest;
      renderStatus(status, latest);
      renderSummary(latest);
      groups.forEach(refreshPanelControls);
      renderAllPanels();
      updateRefreshNote(
        "Updated {time}"
      );
    } catch (error) {
      setStatus(byId("live-status"), t("Connection failed"), "bad");
      setStatus(byId("learner-state"), t("Disconnected"), "bad");
      setStatus(byId("server-state"), t("State unknown"), "bad");
      byId("learner-count").textContent = "— / 1";
      byId("server-count").textContent = "— / 1";
      byId("stream-status").textContent = t("Metric stream: {error}", {error: String(error)});
      updateRefreshNote(
        "Disconnected {time}"
      );
    } finally {
      state.polling = false;
    }
  };

  const populateSelect = (id, options, current) => {
    const select = byId(id);
    select.replaceChildren();
    options.forEach(option => {
      const element = document.createElement("option");
      element.value = option.key;
      element.textContent = t(option.label);
      select.appendChild(element);
    });
    select.value = current;
  };
  const applyRefreshInterval = () => {
    if (state.timer !== null) clearInterval(state.timer);
    state.timer = state.refreshMs > 0
      ? setInterval(() => poll(), state.refreshMs)
      : null;
    updateRefreshNote();
  };
  byId("time-range").addEventListener("change", async event => {
    state.timeRange = event.target.value;
    state.domains.clear();
    // 历史档需要等待数据到位后再统一渲染，避免"先空后满"的两段式闪烁。
    if (HISTORY_RANGES.has(state.timeRange)) {
      byId("history-status").textContent = t("Loading history…");
    }
    await loadHistory(true);
    renderAllPanels();
  });
  byId("refresh-interval").addEventListener("change", event => {
    const option = REFRESH_INTERVALS.find(item => item.key === event.target.value);
    state.refreshMs = option ? option.ms : 5000;
    applyRefreshInterval();
  });
  byId("refresh-now").addEventListener("click", () => poll());
  byId("create-panel").addEventListener("click", () => openEditor(null));
  byId("close-editor").addEventListener("click", () => byId("metric-editor").close());
  byId("metric-category").addEventListener("change", renderMetricChoices);
  byId("metric-search").addEventListener("input", renderMetricChoices);
  byId("reset-panels").addEventListener("click", async () => {
    state.focus = {};
    state.anchor = {};
    state.domains.clear();
    initializeGroups(null);
    saveLayout();
    await poll();
    await loadHistory(true);
    renderAllPanels();
  });
  byId("panel-form").addEventListener("submit", async event => {
    event.preventDefault();
    const title = byId("panel-name").value.trim();
    if (!title || !selectedFields.size) return;
    const selections = [...selectedFields].map(fieldId => {
      const metric = registry.get(fieldId);
      // Follow the logical field across runs. When the catalog contains multiple
      // sources for it, preserve the particular series selected in the editor.
      return metric?.metric_id &&
        [...registry.values()].filter(item => item.metric_id === metric.metric_id).length === 1
        ? metric.metric_id : fieldId;
    });
    let group = editingGroup;
    if (group) {
      group.title = title;
      group.selections = selections;
      resolveGroup(group);
    } else {
      group = addGroup({
        id: `custom-${crypto.randomUUID()}`, title, custom: true,
        category: byId("metric-category").value,
        selections
      });
    }
    byId("metric-editor").close();
    buildPanels();
    saveLayout();
    await poll();
    await loadHistory(true);
    renderAllPanels();
  });
  // viewBox 依赖容器实际宽度，布局变化后需重算，否则字号与刻度会失配。
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (resizeTimer !== null) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resizeTimer = null;
      renderAllPanels();
    }, 160);
  });

  byId("language").addEventListener("change", event => {
    language = event.target.value;
    try { localStorage.setItem("rl-monitor-language", language); }
    catch (error) { setLayoutStatus("Could not save layout: {error}", {error: error.message}); }
    translateStatic();
    if (state.layoutNotice) setLayoutStatus(state.layoutNotice.key, state.layoutNotice.values);
    populateSelect("time-range", TIME_RANGES, state.timeRange);
    populateSelect("refresh-interval", REFRESH_INTERVALS, REFRESH_INTERVALS.find(item => item.ms === state.refreshMs).key);
    buildPanels();
    renderStatus(state.status, state.latest);
    renderSummary(state.latest);
    updateRefreshNote();
    if (HISTORY_RANGES.has(state.timeRange)) {
      byId("history-status").textContent = !state.historyAvailable
        ? t("History unavailable; showing retained data")
        : state.historyRecords.length ? t("History points: {count}", {count: formatInteger(state.historyRecords.length)}) : t("No history yet");
    }
    if (byId("metric-editor").open) {
      byId("metric-editor").close();
      openEditor(editingGroup);
    }
  });
  translateStatic();
  populateSelect("time-range", TIME_RANGES, state.timeRange);
  populateSelect("refresh-interval", REFRESH_INTERVALS, "5s");
  buildPanels();
  poll();
  applyRefreshInterval();
</script>
</body>
</html>
