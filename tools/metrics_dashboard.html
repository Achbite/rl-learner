<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Learner 本地训练监控</title>
  <style>
    :root {
      color-scheme: light dark;
      --window: light-dark(#f5f5f7, #121214);
      --chrome: light-dark(rgba(255, 255, 255, .84), rgba(34, 34, 37, .86));
      --surface: light-dark(#fff, #202023);
      --raised: light-dark(#fbfbfd, #29292d);
      --soft: light-dark(#f0f1f4, #2d2d31);
      --label: light-dark(#1d1d1f, #f5f5f7);
      --secondary: light-dark(#68686d, #aaaab1);
      --separator: light-dark(rgba(60, 60, 67, .16), rgba(235, 235, 245, .14));
      --separator-strong: light-dark(rgba(60, 60, 67, .25), rgba(235, 235, 245, .23));
      --grid: light-dark(rgba(60, 60, 67, .1), rgba(235, 235, 245, .1));
      --blue: light-dark(#007aff, #0a84ff);
      --green: light-dark(#248a3d, #30d158);
      --orange: light-dark(#c93400, #ff9f0a);
      --red: light-dark(#d70015, #ff453a);
      --purple: light-dark(#8944ab, #bf5af2);
      --teal: light-dark(#008299, #64d2ff);
      --pink: light-dark(#d30f45, #ff375f);
      --indigo: light-dark(#3634a3, #5e5ce6);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--window);
      color: var(--label);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--window); color: var(--label); }
    button, select, input { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .app { width: 100%; min-height: 100vh; }
    .titlebar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--separator);
    }
    .title-leading, .brand-line, .pod-head, .toolbar, .toolbar-group,
    .footer, .tag, .live-badge, .pod-state {
      display: flex;
      align-items: center;
    }
    .title-leading { min-width: 0; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      color: #fff;
      background: var(--blue);
      border-radius: 9px;
      font-weight: 600;
    }
    .brand-copy { min-width: 0; }
    .brand-line { align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .product-title, .pod-name, .panel-title, .depth-value { font-weight: 600; }
    .product-context {
      overflow: hidden;
      color: var(--secondary);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .live-badge, .pod-state {
      gap: 6px;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--separator);
      border-radius: 999px;
      white-space: nowrap;
    }
    .live-badge::before, .pod-state::before {
      width: 7px;
      height: 7px;
      content: "";
      background: var(--orange);
      border-radius: 50%;
    }
    .live-badge[data-state="ok"], .pod-state[data-state="ok"] {
      background: light-dark(rgba(52, 199, 89, .1), rgba(48, 209, 88, .12));
      border-color: light-dark(rgba(36, 138, 61, .24), rgba(48, 209, 88, .28));
    }
    .live-badge[data-state="ok"]::before, .pod-state[data-state="ok"]::before { background: var(--green); }
    .live-badge[data-state="bad"]::before, .pod-state[data-state="bad"]::before { background: var(--red); }
    .topology {
      padding: 14px;
      background: var(--chrome);
      border-bottom: 1px solid var(--separator);
    }
    .section-title { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    .pod-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .pod-card {
      min-width: 0;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--separator);
      border-radius: 13px;
    }
    .pod-head { justify-content: space-between; gap: 12px; }
    .pod-identity { display: flex; align-items: center; min-width: 0; gap: 9px; }
    .pod-icon {
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      color: var(--blue);
      background: light-dark(rgba(0, 122, 255, .1), rgba(10, 132, 255, .14));
      border-radius: 9px;
      font-weight: 600;
    }
    .pod-count { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pod-state { min-height: 25px; padding: 3px 8px; color: var(--secondary); }
    .pod-detail {
      margin-top: 8px;
      color: var(--secondary);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .depth-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      background: var(--separator);
      border-bottom: 1px solid var(--separator);
    }
    .depth-item { min-width: 0; padding: 12px 14px; background: var(--surface); }
    .depth-label { color: var(--secondary); }
    .depth-value { margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .depth-item:first-child .depth-value { color: var(--blue); }
    .not-available { color: var(--orange); }
    .toolbar {
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 9px 14px;
      background: var(--chrome);
      border-bottom: 1px solid var(--separator);
    }
    .toolbar-group { flex-wrap: wrap; gap: 7px; }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--secondary);
    }
    .select {
      min-height: 31px;
      padding: 4px 28px 4px 9px;
      color: var(--label);
      background: var(--surface);
      border: 1px solid var(--separator-strong);
      border-radius: 8px;
    }
    .refresh-button {
      min-height: 31px;
      padding: 4px 12px;
      color: var(--label);
      background: var(--surface);
      border: 1px solid var(--separator-strong);
      border-radius: 8px;
      cursor: pointer;
    }
    .refresh-button:hover { border-color: var(--blue); }
    .toolbar-note {
      color: var(--secondary);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px;
      align-items: start;
    }
    .panel {
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--separator);
      border-radius: 13px;
      box-shadow: 0 1px 3px light-dark(rgba(0, 0, 0, .04), rgba(0, 0, 0, .24));
    }
    .panel-head { padding: 12px 13px 9px; }
    .panel-title { margin: 0; font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 38px; padding: 0 13px 10px; }
    .tag, .add-metric {
      min-height: 28px;
      padding: 4px 8px;
      color: var(--secondary);
      background: var(--raised);
      border: 1px solid var(--separator);
      border-radius: 8px;
      cursor: pointer;
    }
    .tag { gap: 6px; }
    .tag[aria-pressed="true"], .add-metric[aria-expanded="true"] {
      color: var(--label);
      border-color: var(--blue);
      background: light-dark(rgba(0, 122, 255, .08), rgba(10, 132, 255, .12));
    }
    .swatch { width: 11px; height: 4px; background: currentColor; border-radius: 999px; }
    .add-metric { display: inline-grid; place-items: center; min-width: 28px; }
    .registry-picker {
      display: grid;
      gap: 5px;
      margin: 0 13px 10px;
      padding: 6px;
      background: var(--soft);
      border: 1px solid var(--separator);
      border-radius: 9px;
    }
    .registry-picker[hidden] { display: none; }
    .registry-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 7px 8px;
      color: var(--label);
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--separator);
      border-radius: 7px;
      cursor: pointer;
    }
    .registry-id {
      min-width: 0;
      overflow: hidden;
      color: var(--secondary);
      font: 12px ui-monospace, "SFMono-Regular", Menlo, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .registry-empty { padding: 5px 7px; color: var(--secondary); }
    .chart-wrap { position: relative; padding: 0 8px 7px; }
    .chart { display: block; width: 100%; overflow: hidden; touch-action: none; }
    .chart-grid { stroke: var(--grid); stroke-width: 1; }
    /* 轴文字随 viewBox 动态计算，字号在各面板宽度下保持一致 */
    .chart-axis { fill: var(--secondary); font-size: 12px; }
    .chart-raw {
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .chart-point { fill: var(--surface); stroke-width: 2.75; vector-effect: non-scaling-stroke; }
    .chart-cursor { stroke: var(--separator-strong); stroke-width: 1; stroke-dasharray: 3 3; }
    .chart-hit { fill: var(--surface); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .empty-chart { fill: var(--secondary); font-size: 14px; }
    .tooltip {
      position: absolute;
      z-index: 2;
      display: grid;
      gap: 3px;
      min-width: 132px;
      max-width: 260px;
      padding: 7px 9px;
      background: var(--surface);
      border: 1px solid var(--separator-strong);
      border-radius: 9px;
      box-shadow: 0 4px 14px light-dark(rgba(0, 0, 0, .12), rgba(0, 0, 0, .44));
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .tooltip[hidden] { display: none; }
    .tooltip-time { color: var(--secondary); }
    .tooltip-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tooltip-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .tooltip-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tooltip-value { font-weight: 600; white-space: nowrap; }
    .tag-value { color: var(--label); font-variant-numeric: tabular-nums; font-weight: 600; }
    .swatch[data-dash="true"] {
      background: repeating-linear-gradient(
        90deg, currentColor 0 4px, transparent 4px 7px
      );
    }
    .footer {
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 9px 14px;
      color: var(--secondary);
      background: var(--chrome);
      border-top: 1px solid var(--separator);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 850px) {
      .pod-grid, .panel-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .titlebar { grid-template-columns: 1fr; }
      .product-context { display: none; }
      .depth-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { align-items: flex-start; }
      .registry-option { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="title-leading">
      <div class="brand-mark" aria-hidden="true">RL</div>
      <div class="brand-copy">
        <div class="brand-line">
          <span class="product-title">本地训练监控</span>
          <span id="run-context" class="product-context">Learner / 等待训练实例</span>
        </div>
      </div>
    </div>
    <span id="live-status" class="live-badge" data-state="wait">正在连接</span>
  </header>

  <section class="topology" aria-label="本地训练运行拓扑">
    <h1 class="section-title">运行拓扑</h1>
    <div class="pod-grid">
      <article class="pod-card" aria-label="Learner Pod">
        <div class="pod-head">
          <div class="pod-identity"><span class="pod-icon" aria-hidden="true">L</span><span class="pod-name">Learner Pod</span></div>
          <div><span id="learner-count" class="pod-count">— / 1</span> <span id="learner-state" class="pod-state" data-state="wait">等待</span></div>
        </div>
      </article>
      <article class="pod-card" aria-label="Server Pod，由 AIServer 与 Client 组成">
        <div class="pod-head">
          <div class="pod-identity"><span class="pod-icon" aria-hidden="true">S</span><span class="pod-name">Server Pod</span></div>
          <div><span id="server-count" class="pod-count">— / 1</span> <span id="server-state" class="pod-state" data-state="wait">等待</span></div>
        </div>
        <div id="server-model-sync" class="pod-detail">等待模型信息</div>
      </article>
    </div>
  </section>

  <section class="depth-strip" aria-label="训练状态">
    <div class="depth-item"><div class="depth-label">Model Step</div><div id="model-step" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Train Update</div><div id="train-update" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Trained Transitions</div><div id="trained-samples" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Produced Transitions</div><div id="produced-samples" class="depth-value">—</div></div>
    <div class="depth-item"><div class="depth-label">Workload</div><div id="training-workload" class="depth-value">Training</div></div>
  </section>

  <section class="toolbar" aria-label="曲线控制">
    <div class="toolbar-group">
      <label class="toggle">时间范围
        <select id="time-range" class="select" aria-label="时间范围"></select>
      </label>
      <label class="toggle">自动刷新
        <select id="refresh-interval" class="select" aria-label="自动刷新间隔"></select>
      </label>
    </div>
    <div class="toolbar-group">
      <button id="refresh-now" type="button" class="refresh-button">立即刷新</button>
      <span id="history-status" class="toolbar-note" role="status"></span>
    </div>
  </section>

  <main id="panel-grid" class="panel-grid" aria-label="本地训练指标曲线"></main>

  <footer class="footer">
    <span id="stream-status">指标流：等待连接</span>
    <span id="last-refresh">尚未刷新</span>
  </footer>
</div>

<script>
  "use strict";

  const SVG_NS = "http://www.w3.org/2000/svg";
  const COLORS = ["--blue", "--green", "--orange", "--red", "--purple", "--teal", "--pink", "--indigo"];
  const MODEL_STEP_ID = "learner.model_step.v1";
  const TRAIN_UPDATE_ID = "learner.train_update.total.v1";
  const TRAINED_SAMPLES_ID = "learner.trained_samples.total.v1";
  const TRAINING_EPISODE_ID = "server.training.episode.completed.total.v1";
  const PRODUCED_SAMPLES_ID = "sample.flow.produced.total.v1";
  // 时间范围与自动刷新档位（Grafana 同款快速档），EVENT_WINDOW 固定为
  // 服务端 episode 聚合窗口，避免时间档被误当作事件窗口下发。
  const TIME_RANGES = [
    {key: "1m", label: "最近 1 分钟", seconds: 60},
    {key: "30m", label: "最近 30 分钟", seconds: 30 * 60},
    {key: "1h", label: "最近 1 小时", seconds: 60 * 60},
    {key: "6h", label: "最近 6 小时", seconds: 6 * 60 * 60},
    {key: "24h", label: "最近 24 小时", seconds: 24 * 60 * 60},
    {key: "all", label: "全部", seconds: null}
  ];
  const REFRESH_INTERVALS = [
    {key: "5s", label: "每 5 秒", ms: 5000},
    {key: "30s", label: "每 30 秒", ms: 30000},
    {key: "1m", label: "每 1 分钟", ms: 60000},
    {key: "5m", label: "每 5 分钟", ms: 300000},
    {key: "off", label: "关闭", ms: 0}
  ];
  const EVENT_WINDOW = "100";
  const HISTORY_RANGES = new Set(["6h", "24h", "all"]);
  const TICK_STEPS_SECONDS = [
    1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800,
    3600, 7200, 21600, 43200, 86400
  ];
  const REWARD_COMPONENT_IDS = [
    "server.training.reward.component.goal_reward.episode_mean.v1",
    "server.training.reward.component.timeout_penalty.episode_mean.v1",
    "server.training.reward.component.geodesic_progress.episode_mean.v1",
    "server.training.reward.component.first_visit_bonus.episode_mean.v1",
    "server.training.reward.component.wasted_action_penalty.episode_mean.v1"
  ];
  const groups = [
    {
      id: "loss", title: "Loss", catalogGroup: "loss",
      initial: ["learner.loss.policy.v1", "learner.loss.value.v1"]
    },
    {
      id: "episode-return", title: "Agent Episode Return", catalogGroup: "episode_return",
      initial: [
        "server.training.episode.learning_return.mean.v1",
        "server.training.episode.learning_return.latest_mean.v1"
      ]
    },
    {
      id: "reward-components", title: "Reward Components", catalogGroup: "reward_components",
      initial: REWARD_COMPONENT_IDS
    },
    {
      id: "episode-success", title: "Agent Success Rate", catalogGroup: "episode_success",
      initial: [
        "server.training.episode.success.any_rate.v1",
        "server.training.episode.success.all_rate.v1"
      ]
    },
    {
      id: "sample-throughput", title: "Sample Throughput", catalogGroup: "sample_throughput",
      initial: [
        "sample.throughput.produced_per_second.v1",
        "sample.throughput.accepted_per_second.v1",
        "sample.throughput.trained_per_second.v1"
      ]
    },
    {
      id: "sample-flow", title: "Sample Flow", catalogGroup: "sample_flow",
      initial: [
        "sample.flow.produced.total.v1",
        "sample.flow.accepted.total.v1",
        "sample.flow.acknowledged.total.v1",
        "sample.flow.trained.total.v1"
      ]
    },
    {
      id: "latency", title: "Latency", catalogGroup: "latency",
      initial: [
        "server.latency.sample_send.mean_ms.v1",
        "server.latency.inference.mean_ms.v1",
        "server.latency.inference.max_ms.v1"
      ]
    },
    {
      id: "ppo-stability", title: "PPO Stability", catalogGroup: "ppo_stability",
      initial: [
        "learner.ppo.entropy.v1",
        "learner.ppo.approx_kl.v1",
        "learner.ppo.clip_fraction.v1",
        "learner.value.prediction_mean.v1",
        "learner.value.return_target_mean.v1",
        "learner.value.explained_variance.v1"
      ]
    }
  ].map(group => ({...group, keys: [], initialized: false, styles: new Map()}));
  const groupById = new Map(groups.map(group => [group.id, group]));
  const registry = new Map();
  const state = {
    records: [],
    recordLimit: 4096,
    cursor: 0,
    sourceId: "",
    timeRange: "30m",
    refreshMs: 5000,
    historyRecords: [],
    historyRange: "",
    historyFetchedAt: 0,
    historyCursor: 0,
    historyFields: "",
    historyAvailable: true,
    focus: {},
    anchor: {},
    domains: new Map(),
    catalogFetchedAt: 0,
    polling: false,
    status: null,
    lastRefreshText: "",
    timer: null
  };

  const byId = id => document.getElementById(id);
  const finiteNumber = value => {
    if (typeof value === "boolean" || value === null || value === "") return null;
    const converted = Number(value);
    return Number.isFinite(converted) ? converted : null;
  };
  const metricValue = (record, fieldId) => finiteNumber(record?.metric_values?.[fieldId]);
  const nested = (object, path) => path.reduce(
    (value, key) => value && value[key] !== undefined ? value[key] : undefined,
    object
  );
  const colorFor = fieldId => {
    let hash = 0;
    for (let index = 0; index < fieldId.length; index += 1) {
      hash = ((hash << 5) - hash + fieldId.charCodeAt(index)) | 0;
    }
    return COLORS[Math.abs(hash) % COLORS.length];
  };
  // 同一面板内按顺序分配颜色，并在颜色用尽后叠加虚线线型；
  // 全局 hash 取色会让同面板曲线撞色（例如 accepted 与 trained 同色）而无法区分。
  const assignGroupStyles = group => {
    group.styles = new Map(group.keys.map((fieldId, index) => [fieldId, {
      color: COLORS[index % COLORS.length],
      dash: index >= COLORS.length
    }]));
  };
  const styleFor = (group, fieldId) => group.styles?.get(fieldId) || {
    color: colorFor(fieldId),
    dash: false
  };
  const dashArrayFor = style => style.dash ? "6 4" : null;
  const setStatus = (element, text, value) => {
    element.textContent = text;
    element.dataset.state = value;
  };
  const formatInteger = value => {
    const number = finiteNumber(value);
    return number === null ? "—" : number.toLocaleString("zh-CN", {
      maximumFractionDigits: 20
    });
  };
  const formatScalar = value => {
    if (value === null || !Number.isFinite(value)) return "—";
    const absolute = Math.abs(value);
    if (absolute > 0 && absolute < .001) return value.toExponential(2);
    if (absolute >= 1000) return value.toLocaleString("zh-CN", {
      maximumFractionDigits: 12
    });
    const digits = absolute < .1 ? 4 : absolute < 10 ? 2 : 1;
    return `${value > 0 ? "+" : ""}${value.toFixed(digits)}`;
  };
  const formatMetric = (metric, value) => {
    if (!metric || value === null || !Number.isFinite(value)) return "—";
    if (metric.unit === "%") return `${value.toFixed(1)}%`;
    if (metric.unit === "ms") return `${formatScalar(value)} ms`;
    if (["samples/s", "transitions/s"].includes(metric.unit)) {
      return `${formatScalar(value)}/s`;
    }
    if (["samples", "transitions", "step", "update", "version"].includes(metric.unit)) {
      return formatInteger(value);
    }
    return formatScalar(value);
  };
  const fieldIdsForGroup = group => [...registry.values()]
    .filter(metric => metric.group === group.catalogGroup)
    .map(metric => metric.field_id);
  // 按量纲分桶：共享 Y 轴要求同量纲，因此多线对比只在同一量纲内成立。
  const dimensionBuckets = group => {
    const buckets = new Map();
    group.keys.forEach(fieldId => {
      const dimension = registry.get(fieldId)?.dimension;
      if (!dimension) return;
      if (!buckets.has(dimension)) buckets.set(dimension, []);
      buckets.get(dimension).push(fieldId);
    });
    return buckets;
  };
  const largestBucket = buckets => {
    let best = [];
    buckets.forEach(fieldIds => {
      if (fieldIds.length > best.length) best = fieldIds;
    });
    return best;
  };
  // 只要任一量纲下有两条以上曲线即可做同类对比；量纲混杂的面板
  // 此前只能逐条单看，信息可达性过低。
  const groupSupportsAll = group =>
    largestBucket(dimensionBuckets(group)).length >= 2;
  const isUniformGroup = group => dimensionBuckets(group).size <= 1;
  // 聚合视图实际绘制的曲线：以锚定指标所属量纲为准，
  // 锚定量纲不足两条时退回最大的量纲桶。
  const resolvedKeys = group => {
    const selected = state.focus[group.id];
    if (selected !== "all") return selected ? [selected] : [];
    const buckets = dimensionBuckets(group);
    const anchor = state.anchor[group.id];
    const anchorDimension = registry.get(anchor)?.dimension;
    const anchored = anchorDimension ? buckets.get(anchorDimension) : null;
    if (anchored && anchored.length >= 2) return anchored;
    const fallback = largestBucket(buckets);
    return fallback.length ? fallback : group.keys.slice(0, 1);
  };
  const normalizeFocus = group => {
    const current = state.focus[group.id];
    if (current === "all" && groupSupportsAll(group)) return;
    if (group.keys.includes(current)) return;
    state.focus[group.id] = groupSupportsAll(group) ? "all" : group.keys[0];
  };

  const applyCatalog = document => {
    if (document?.schema_version !== 1 || document?.catalog_version !== 1 ||
        !Array.isArray(document.fields)) {
      throw new Error("metrics catalog contract mismatch");
    }
    const nextRegistry = new Map();
    document.fields.forEach(field => {
      const required = [
        "field_id", "label", "group", "dimension", "unit",
        "scope", "statistic", "value_kind"
      ];
      if (!required.every(key => typeof field[key] === "string" && field[key])) return;
      nextRegistry.set(field.field_id, {...field});
    });
    registry.clear();
    nextRegistry.forEach((value, key) => registry.set(key, value));
    groups.forEach(group => {
      const available = fieldIdsForGroup(group);
      const availableSet = new Set(available);
      if (!group.initialized) {
        group.keys = group.initial.filter(fieldId => availableSet.has(fieldId));
        if (!group.keys.length && available.length) group.keys = [available[0]];
        group.initialized = true;
      } else {
        group.keys = group.keys.filter(fieldId => availableSet.has(fieldId));
        if (!group.keys.length && available.length) {
          const preferred = group.initial.find(fieldId => availableSet.has(fieldId));
          group.keys = [preferred || available[0]];
        }
      }
      normalizeFocus(group);
      assignGroupStyles(group);
      refreshPanelControls(group);
    });
  };

  const refreshCatalog = async force => {
    const now = Date.now();
    if (!force && now - state.catalogFetchedAt < 10000) return;
    const response = await fetch("/api/metrics/catalog", {cache: "no-store"});
    if (!response.ok) throw new Error(`catalog HTTP ${response.status}`);
    applyCatalog(await response.json());
    state.catalogFetchedAt = now;
  };

  const svgElement = (name, attributes = {}) => {
    const element = document.createElementNS(SVG_NS, name);
    Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, String(value)));
    return element;
  };
  const appendText = (svg, x, y, text, anchor = "start", className = "chart-axis") => {
    const element = svgElement("text", {x, y, "text-anchor": anchor, class: className});
    element.textContent = text;
    svg.appendChild(element);
  };
  const formatTickTime = (timestamp, spanSeconds) => {
    const date = new Date(timestamp * 1000);
    if (spanSeconds > 86400) {
      return date.toLocaleString("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }
    return date.toLocaleTimeString("zh-CN", {
      hour: "2-digit",
      minute: "2-digit",
      second: spanSeconds <= 600 ? "2-digit" : undefined
    });
  };
  // 历史层与实时层按 sequence 去重合并，实时层优先（精度更高）。
  const combinedRecords = () => {
    if (!state.historyRecords.length) return state.records;
    const firstLiveSequence = state.records.length
      ? Number(state.records[0].sequence)
      : Infinity;
    const older = state.historyRecords.filter(
      record => Number(record.sequence) < firstLiveSequence
    );
    return older.concat(state.records);
  };
  // 统一时间域：所有面板共享同一时间范围与刻度，逐像素对齐。
  const currentDomain = records => {
    const range = TIME_RANGES.find(item => item.key === state.timeRange);
    if (!range) return null;
    // 线性扫描取时间极值；24h 档记录可达上万条，
    // Math.min(...array) 形式的展开既有栈溢出风险也更慢。
    let earliest = Infinity;
    let latest = -Infinity;
    for (let index = 0; index < records.length; index += 1) {
      const timestamp = finiteNumber(records[index].timestamp);
      if (timestamp === null) continue;
      if (timestamp < earliest) earliest = timestamp;
      if (timestamp > latest) latest = timestamp;
    }
    if (earliest === Infinity) return null;
    // 记录时间戳来自容器时钟，窗口右端只用浏览器 now 会在容器时钟偏快时
    // 把最新数据裁掉；取两者较大值兼顾滚动窗口与时钟偏差。
    const maximum = Math.max(Date.now() / 1000, latest);
    // 各档右端语义一致地表示"现在"：滚动档按范围回溯，全部档从数据起点展开。
    if (range.seconds === null) {
      return {minimum: earliest, maximum: Math.max(maximum, earliest + 60)};
    }
    return {minimum: maximum - range.seconds, maximum};
  };
  const tickStepFor = spanSeconds => {
    const target = spanSeconds / 6;
    const step = TICK_STEPS_SECONDS.find(candidate => candidate >= target);
    return step === undefined ? Math.ceil(target / 86400) * 86400 : step;
  };
  // 像素级降采样：单序列顶点超过绘图宽度两倍时按像素桶取 min/max 包络，
  // 保住尖峰的同时把 path 顶点数限制在屏幕可分辨范围内。
  const decimatePoints = (points, plotLeft, plotWidth) => {
    const bucketCount = Math.max(1, Math.floor(plotWidth));
    if (points.length <= bucketCount * 2) return points;
    const buckets = new Array(bucketCount);
    points.forEach(point => {
      let index = Math.floor((point.x - plotLeft) / plotWidth * bucketCount);
      index = Math.max(0, Math.min(bucketCount - 1, index));
      (buckets[index] || (buckets[index] = [])).push(point);
    });
    const reduced = [];
    buckets.forEach(bucket => {
      if (!bucket) return;
      if (bucket.length <= 2) {
        reduced.push(...bucket);
        return;
      }
      let low = bucket[0];
      let high = bucket[0];
      bucket.forEach(point => {
        if (point.y < low.y) low = point;
        if (point.y > high.y) high = point;
      });
      // 桶内平坦时 min 与 max 为同一点，只输出一次避免重复顶点。
      if (low === high) {
        reduced.push(low);
        return;
      }
      reduced.push(...[low, high].sort((left, right) => left.x - right.x));
    });
    return reduced;
  };
  // 单次线性扫描求极值；此前的 sort() 在 24h 档会对数万元素排序，
  // 每个刷新周期为每个面板重复一次，足以阻塞主线程。
  const observedExtent = values => {
    let minimum = Infinity;
    let maximum = -Infinity;
    for (let index = 0; index < values.length; index += 1) {
      const value = values[index];
      if (!Number.isFinite(value)) continue;
      if (value < minimum) minimum = value;
      if (value > maximum) maximum = value;
    }
    return minimum === Infinity ? null : {minimum, maximum};
  };
  const niceCeil = value => {
    if (!(value > 0)) return 0;
    const exponent = Math.floor(Math.log10(value));
    const magnitude = 10 ** exponent;
    const fraction = value / magnitude;
    const step = [1, 2, 2.5, 5, 10].find(candidate => candidate >= fraction) || 10;
    return step * magnitude;
  };
  const niceFloor = value => {
    if (!(value > 0)) return 0;
    const exponent = Math.floor(Math.log10(value));
    const magnitude = 10 ** exponent;
    const fraction = value / magnitude;
    const candidates = [1, 2, 2.5, 5, 10].filter(candidate => candidate <= fraction);
    return (candidates[candidates.length - 1] || 1) * magnitude;
  };
  const niceLower = value => value < 0 ? -niceCeil(Math.abs(value)) : niceFloor(value);
  const niceUpper = value => value < 0 ? -niceFloor(Math.abs(value)) : niceCeil(value);
  const targetDomain = (metric, values) => {
    if (metric.dimension === "percentage") {
      return {minimum: 0, maximum: 100, observedMinimum: 0, observedMaximum: 100, fixed: true};
    }
    const observed = observedExtent(values);
    if (!observed) {
      return {minimum: 0, maximum: 1, observedMinimum: 0, observedMaximum: 1, fixed: false};
    }
    const rawSpan = Math.max(observed.maximum - observed.minimum, 0);
    const scale = Math.max(Math.abs(observed.minimum), Math.abs(observed.maximum), 1e-9);
    const padding = Math.max(rawSpan * .08, scale * .04, 1e-9);
    const zeroFloor = [
      "sample_count", "sample_rate", "duration", "environment_step",
      "cell_count"
    ].includes(metric.dimension);
    const zeroBaseline = metric.dimension === "loss";
    let minimum;
    let maximum;
    if (zeroFloor) {
      minimum = 0;
      maximum = niceCeil(Math.max(observed.maximum + padding, 1e-9));
    } else if (zeroBaseline) {
      minimum = observed.minimum < 0
        ? -niceCeil(Math.abs(observed.minimum - padding))
        : 0;
      maximum = observed.maximum > 0
        ? niceCeil(observed.maximum + padding)
        : 0;
      if (minimum === maximum) {
        minimum = -niceCeil(padding);
        maximum = niceCeil(padding);
      }
    } else {
      minimum = niceLower(observed.minimum - padding);
      maximum = niceUpper(observed.maximum + padding);
      if (minimum === maximum) {
        const margin = niceCeil(Math.max(scale * .1, 1e-9));
        minimum -= margin;
        maximum += margin;
      }
    }
    return {
      minimum,
      maximum,
      observedMinimum: observed.minimum,
      observedMaximum: observed.maximum,
      fixed: false
    };
  };
  const stableDomain = (group, keys, metric, values) => {
    const target = targetDomain(metric, values);
    if (target.fixed) return [target.minimum, target.maximum];
    const domainKey = `${state.sourceId}|${group.id}|${keys.join(",")}`;
    const now = Date.now();
    let current = state.domains.get(domainKey);
    if (!current) {
      current = {minimum: target.minimum, maximum: target.maximum, insideSince: null};
      state.domains.set(domainKey, current);
      return [current.minimum, current.maximum];
    }
    const expands = target.minimum < current.minimum || target.maximum > current.maximum;
    if (expands) {
      current.minimum = Math.min(current.minimum, target.minimum);
      current.maximum = Math.max(current.maximum, target.maximum);
      current.insideSince = null;
      return [current.minimum, current.maximum];
    }
    const span = current.maximum - current.minimum;
    const innerMinimum = current.minimum + span * .2;
    const innerMaximum = current.maximum - span * .2;
    const inside = target.observedMinimum >= innerMinimum &&
      target.observedMaximum <= innerMaximum;
    if (!inside) {
      current.insideSince = null;
      return [current.minimum, current.maximum];
    }
    if (current.insideSince === null) current.insideSince = now;
    if (now - current.insideSince >= 30000) {
      current.minimum = target.minimum;
      current.maximum = target.maximum;
      current.insideSince = null;
    }
    return [current.minimum, current.maximum];
  };
  const pathFor = points => points.map(
    (point, index) => `${index ? "L" : "M"} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`
  ).join(" ");

  const CHART_HEIGHT = 260;
  const CHART_MARGIN = {left: 72, right: 18, top: 15, bottom: 39};
  // 每个面板的最近一次渲染几何与序列，供 crosshair 命中查询复用。
  const hoverState = new Map();

  // 图例直接显示各曲线当前值，多线面板无需悬停即可读数。
  const applyLegendValues = (group, series) => {
    const panel = document.querySelector(`[data-group="${group.id}"]`);
    if (!panel) return;
    const latest = new Map(series.map(item => [
      item.metric.field_id,
      item.points[item.points.length - 1]?.value ?? null
    ]));
    panel.querySelectorAll(".tag[data-metric]").forEach(tag => {
      const slot = tag.querySelector(".tag-value");
      if (!slot) return;
      const fieldId = tag.dataset.metric;
      const metric = registry.get(fieldId);
      slot.textContent = latest.has(fieldId)
        ? formatMetric(metric, latest.get(fieldId))
        : "";
    });
  };

  const hideTooltip = panel => {
    const tooltip = panel.querySelector(".tooltip");
    if (tooltip) tooltip.hidden = true;
    panel.querySelectorAll(".chart-cursor, .chart-hit").forEach(
      element => element.remove()
    );
  };
  // 就近命中：按指针 x 反解时间，再在各序列内二分查找最接近的样本点。
  const nearestPoint = (points, timestamp) => {
    let low = 0;
    let high = points.length - 1;
    while (low < high) {
      const middle = (low + high) >> 1;
      if (points[middle].timestamp < timestamp) low = middle + 1;
      else high = middle;
    }
    const candidate = points[low];
    const previous = points[low - 1];
    if (!previous) return candidate;
    return Math.abs(previous.timestamp - timestamp) <=
      Math.abs(candidate.timestamp - timestamp) ? previous : candidate;
  };
  const showTooltip = (group, event) => {
    const panel = document.querySelector(`[data-group="${group.id}"]`);
    const cached = hoverState.get(group.id);
    if (!panel || !cached) return;
    const svg = panel.querySelector("svg");
    const tooltip = panel.querySelector(".tooltip");
    const {geometry, domain, span} = cached;
    const bounds = svg.getBoundingClientRect();
    if (!bounds.width) return;
    const scale = geometry.width / bounds.width;
    const x = (event.clientX - bounds.left) * scale;
    if (x < geometry.left || x > geometry.width - geometry.right) {
      hideTooltip(panel);
      return;
    }
    const timestamp = domain.minimum +
      (x - geometry.left) / geometry.chartWidth * span;
    panel.querySelectorAll(".chart-cursor, .chart-hit").forEach(
      element => element.remove()
    );
    const rows = [];
    cached.series.forEach(item => {
      const point = nearestPoint(item.points, timestamp);
      if (!point) return;
      rows.push({metric: item.metric, style: item.style, point});
      svg.appendChild(svgElement("circle", {
        cx: cached.xFor(point.timestamp),
        cy: cached.yFor(point.value),
        r: 3.5, class: "chart-hit", stroke: `var(${item.style.color})`
      }));
    });
    if (!rows.length) {
      hideTooltip(panel);
      return;
    }
    const cursorX = cached.xFor(rows[0].point.timestamp);
    svg.insertBefore(svgElement("line", {
      x1: cursorX, y1: geometry.top, x2: cursorX,
      y2: geometry.top + geometry.chartHeight, class: "chart-cursor"
    }), svg.firstChild);
    tooltip.replaceChildren();
    const time = document.createElement("div");
    time.className = "tooltip-time";
    time.textContent = new Date(rows[0].point.timestamp * 1000)
      .toLocaleTimeString("zh-CN");
    tooltip.appendChild(time);
    rows.forEach(row => {
      const line = document.createElement("div");
      line.className = "tooltip-row";
      const name = document.createElement("span");
      name.className = "tooltip-name";
      const swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.color = `var(${row.style.color})`;
      if (row.style.dash) swatch.dataset.dash = "true";
      const label = document.createElement("span");
      label.className = "tooltip-label";
      label.textContent = row.metric.label;
      name.append(swatch, label);
      const value = document.createElement("span");
      value.className = "tooltip-value";
      value.textContent = formatMetric(row.metric, row.point.value);
      line.append(name, value);
      tooltip.appendChild(line);
    });
    tooltip.hidden = false;
    const wrap = panel.querySelector(".chart-wrap");
    const localX = cursorX / scale + 14;
    const maximumX = wrap.clientWidth - tooltip.offsetWidth - 8;
    tooltip.style.left = `${Math.max(8, Math.min(localX, maximumX))}px`;
    tooltip.style.top = "12px";
  };

  // viewBox 宽度跟随容器实际像素宽度，使 1 用户单位等于 1 CSS 像素，
  // 轴文字字号在单列与双列布局下保持一致，不再随面板宽度缩放。
  const chartGeometry = panel => {
    const wrap = panel.querySelector(".chart-wrap");
    const measured = Math.round(wrap?.clientWidth || 0) - 16;
    const width = Math.max(320, measured > 0 ? measured : 664);
    return {
      width,
      height: CHART_HEIGHT,
      ...CHART_MARGIN,
      chartWidth: width - CHART_MARGIN.left - CHART_MARGIN.right,
      chartHeight: CHART_HEIGHT - CHART_MARGIN.top - CHART_MARGIN.bottom
    };
  };

  const renderPanel = (group, context) => {
    const panel = document.querySelector(`[data-group="${group.id}"]`);
    if (!panel) return;
    const svg = panel.querySelector("svg");
    svg.replaceChildren();
    const domain = context.domain;
    const selected = state.focus[group.id];
    const keys = resolvedKeys(group);
    panel.dataset.focus = selected || "";
    svg.setAttribute("aria-label", `${group.title} 曲线，横轴 Wall Time`);

    const geometry = chartGeometry(panel);
    const {width, height, left, right, top, chartWidth, chartHeight} = geometry;
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svg.setAttribute("height", String(height));
    hoverState.delete(group.id);

    if (!domain || !keys.length) {
      delete panel.dataset.yMin;
      delete panel.dataset.yMax;
      appendText(svg, width / 2, height / 2, "等待指标", "middle", "empty-chart");
      return;
    }
    const span = domain.maximum - domain.minimum;
    const visibleRecords = context.records.filter(record => {
      const timestamp = finiteNumber(record.timestamp);
      return timestamp !== null &&
        timestamp >= domain.minimum && timestamp <= domain.maximum;
    });
    const series = keys.map(fieldId => {
      const metric = registry.get(fieldId);
      const points = visibleRecords.map(record => ({
        timestamp: finiteNumber(record.timestamp),
        value: metricValue(record, fieldId)
      })).filter(point => point.timestamp !== null && point.value !== null);
      return {metric, style: styleFor(group, fieldId), points};
    }).filter(item => item.metric && item.points.length);
    if (!series.length || !(span > 0)) {
      delete panel.dataset.yMin;
      delete panel.dataset.yMax;
      appendText(
        svg, width / 2, height / 2, "所选范围暂无数据", "middle", "empty-chart"
      );
      return;
    }

    const rawValues = series.flatMap(item => item.points.map(point => point.value));
    const [minimum, maximum] = stableDomain(
      group, keys, series[0].metric, rawValues
    );
    panel.dataset.yMin = String(minimum);
    panel.dataset.yMax = String(maximum);
    const yFor = value => top + (maximum - value) / (maximum - minimum) * chartHeight;
    const xFor = timestamp => {
      const ratio = Math.max(
        0,
        Math.min(1, (timestamp - domain.minimum) / span)
      );
      return left + ratio * chartWidth;
    };
    const axisMetric = series[0].metric;

    for (let tick = 0; tick < 5; tick += 1) {
      const ratio = tick / 4;
      const y = top + ratio * chartHeight;
      svg.appendChild(svgElement("line", {
        x1: left, y1: y, x2: width - right, y2: y, class: "chart-grid"
      }));
      appendText(
        svg,
        left - 8,
        y + 4,
        formatMetric(axisMetric, maximum - ratio * (maximum - minimum)),
        "end"
      );
    }
    const tickStep = tickStepFor(span);
    const firstTick = Math.ceil(domain.minimum / tickStep) * tickStep;
    for (let tickTime = firstTick; tickTime <= domain.maximum; tickTime += tickStep) {
      const x = xFor(tickTime);
      svg.appendChild(svgElement("line", {
        x1: x, y1: top, x2: x, y2: top + chartHeight, class: "chart-grid"
      }));
      appendText(
        svg,
        x,
        height - 12,
        formatTickTime(tickTime, span),
        x < left + 26 ? "start" : x > width - right - 26 ? "end" : "middle"
      );
    }

    const clipId = `plot-${group.id}`;
    const defs = svgElement("defs");
    const clipPath = svgElement("clipPath", {id: clipId});
    clipPath.appendChild(svgElement("rect", {
      x: left, y: top, width: chartWidth, height: chartHeight
    }));
    defs.appendChild(clipPath);
    svg.appendChild(defs);
    series.forEach(item => {
      const pixelPoints = item.points.map(point => ({
        x: xFor(point.timestamp),
        y: yFor(point.value)
      }));
      const color = `var(${item.style.color})`;
      const dashArray = dashArrayFor(item.style);
      const attributes = {
        d: pathFor(decimatePoints(pixelPoints, left, chartWidth)),
        class: "chart-raw", stroke: color,
        "clip-path": `url(#${clipId})`
      };
      if (dashArray) attributes["stroke-dasharray"] = dashArray;
      svg.appendChild(svgElement("path", attributes));
      const latest = pixelPoints[pixelPoints.length - 1];
      svg.appendChild(svgElement("circle", {
        cx: latest.x, cy: latest.y, r: 4.5, class: "chart-point",
        stroke: color, "clip-path": `url(#${clipId})`
      }));
    });
    // 缓存几何与序列供 crosshair 命中查询，避免每次指针移动重算数据。
    hoverState.set(group.id, {geometry, domain, span, series, xFor, yFor});
    applyLegendValues(group, series);
  };

  const buildRenderContext = () => {
    const records = combinedRecords();
    return {records, domain: currentDomain(records)};
  };
  const renderAllPanels = () => {
    const context = buildRenderContext();
    groups.forEach(group => renderPanel(group, context));
  };
  const renderGroup = group => renderPanel(group, buildRenderContext());
  const closeAllPickers = () => {
    document.querySelectorAll(".registry-picker").forEach(element => {
      element.hidden = true;
    });
    document.querySelectorAll(".add-metric").forEach(element => {
      element.setAttribute("aria-expanded", "false");
    });
  };
  const catalogCandidates = group => {
    const tracked = new Set(group.keys);
    return fieldIdsForGroup(group).filter(fieldId => !tracked.has(fieldId));
  };

  function refreshPanelControls(group) {
    const panel = document.querySelector(`[data-group="${group.id}"]`);
    if (!panel) return;
    normalizeFocus(group);
    const tags = panel.querySelector(".tags");
    const picker = panel.querySelector(".registry-picker");
    // 仅在标签集合发生结构变化时重建 DOM；每轮轮询无条件重建会丢失键盘焦点、
    // 重置候选列表的展开状态，并让图例数值闪烁。
    const signature = `${
      groupSupportsAll(group) ? (isUniformGroup(group) ? "all|" : "same|") : ""
    }${group.keys.join(",")}`;
    if (tags.dataset.signature !== signature) {
      tags.replaceChildren();
      const addTag = (fieldId, label, style) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tag";
        button.dataset.metric = fieldId;
        button.setAttribute(
          "aria-label",
          fieldId === "all"
            ? `显示 ${group.title} 同量纲全部曲线`
            : `在 ${group.title} 聚焦 ${label}`
        );
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.color = style.color;
        if (style.dash) swatch.dataset.dash = "true";
        const text = document.createElement("span");
        text.textContent = label;
        const value = document.createElement("span");
        value.className = "tag-value";
        button.append(swatch, text, value);
        button.addEventListener("click", () => {
          state.focus[group.id] = fieldId;
          // 记录锚点量纲，使聚合视图显示与该指标同量纲的曲线。
          if (fieldId !== "all") state.anchor[group.id] = fieldId;
          refreshPanelControls(group);
          renderGroup(group);
        });
        tags.appendChild(button);
      };
      if (groupSupportsAll(group)) {
        addTag(
          "all",
          isUniformGroup(group) ? "全部" : "同类",
          {color: "var(--secondary)", dash: false}
        );
      }
      group.keys.forEach(fieldId => {
        const metric = registry.get(fieldId);
        if (!metric) return;
        const style = styleFor(group, fieldId);
        addTag(fieldId, metric.label, {
          color: `var(${style.color})`,
          dash: style.dash
        });
      });

      const add = document.createElement("button");
      add.type = "button";
      add.className = "add-metric";
      add.textContent = "＋";
      add.setAttribute("aria-label", `向 ${group.title} 添加追踪变量`);
      add.setAttribute("aria-expanded", String(!picker.hidden));
      add.addEventListener("click", () => {
        const open = picker.hidden;
        closeAllPickers();
        picker.hidden = !open;
        add.setAttribute("aria-expanded", String(open));
        if (open) refreshPicker(group, picker);
      });
      tags.appendChild(add);
      tags.dataset.signature = signature;
    }
    tags.querySelectorAll(".tag[data-metric]").forEach(tag => {
      tag.setAttribute(
        "aria-pressed",
        String(state.focus[group.id] === tag.dataset.metric)
      );
    });
  }

  const refreshPicker = (group, picker) => {
    picker.replaceChildren();
    const candidates = catalogCandidates(group);
    if (!candidates.length) {
      const empty = document.createElement("div");
      empty.className = "registry-empty";
      empty.textContent = "暂无可添加变量";
      picker.appendChild(empty);
      return;
    }
    candidates.forEach(fieldId => {
      const metric = registry.get(fieldId);
      const option = document.createElement("button");
      option.type = "button";
      option.className = "registry-option";
      option.setAttribute(
        "aria-label",
        `添加 ${metric.label}，字段 ID ${metric.field_id}`
      );
      const label = document.createElement("span");
      label.textContent = metric.label;
      const id = document.createElement("span");
      id.className = "registry-id";
      id.textContent = metric.field_id;
      option.append(label, id);
      option.addEventListener("click", () => {
        if (!group.keys.includes(fieldId)) group.keys.push(fieldId);
        state.focus[group.id] = fieldId;
        state.anchor[group.id] = fieldId;
        closeAllPickers();
        assignGroupStyles(group);
        refreshPanelControls(group);
        renderGroup(group);
      });
      picker.appendChild(option);
    });
  };

  const buildPanels = () => {
    const grid = byId("panel-grid");
    groups.forEach(group => {
      const panel = document.createElement("section");
      panel.className = "panel";
      panel.dataset.group = group.id;
      panel.setAttribute("aria-label", `${group.title} 独立统计面板`);
      const head = document.createElement("div");
      head.className = "panel-head";
      const title = document.createElement("h2");
      title.className = "panel-title";
      title.textContent = group.title;
      head.appendChild(title);
      const tags = document.createElement("div");
      tags.className = "tags";
      tags.setAttribute("aria-label", `${group.title} 曲线标签`);
      const picker = document.createElement("div");
      picker.className = "registry-picker";
      picker.hidden = true;
      const wrap = document.createElement("div");
      wrap.className = "chart-wrap";
      const chart = svgElement("svg", {
        class: "chart", viewBox: `0 0 664 ${CHART_HEIGHT}`, role: "img"
      });
      const tooltip = document.createElement("div");
      tooltip.className = "tooltip";
      tooltip.hidden = true;
      tooltip.setAttribute("role", "tooltip");
      wrap.append(chart, tooltip);
      chart.addEventListener("pointermove", event => showTooltip(group, event));
      chart.addEventListener("pointerleave", () => hideTooltip(panel));
      panel.append(head, tags, picker, wrap);
      grid.appendChild(panel);
      refreshPanelControls(group);
      renderGroup(group);
    });
  };

  const resetStream = sourceId => {
    state.records = [];
    state.cursor = 0;
    state.sourceId = sourceId || "";
    state.domains.clear();
    state.catalogFetchedAt = 0;
    state.historyRecords = [];
    state.historyRange = "";
    state.historyFetchedAt = 0;
    state.historyCursor = 0;
    state.historyFields = "";
    renderAllPanels();
  };
  // 关闭自动刷新后画面会停在最后一次拉取的数据上，
  // 必须显式提示，否则容易被误读为训练已停止。
  const updateRefreshNote = (text) => {
    const suffix = state.refreshMs > 0 ? "" : " · 自动刷新已关闭";
    if (text !== undefined) state.lastRefreshText = text;
    byId("last-refresh").textContent =
      `${state.lastRefreshText || "尚未刷新"}${suffix}`;
  };
  // 当前所有面板追踪的字段并集：历史端点按此裁剪响应，
  // 未裁剪时单次 24h 响应可达 20MB 量级。
  const trackedFieldSignature = () => [...new Set(
    groups.flatMap(group => group.keys)
  )].sort().join(",");
  // 6h/24h/all 大范围切换到服务端粗粒度历史层；服务端无该端点时降级为仅保留段。
  const loadHistory = async force => {
    if (!HISTORY_RANGES.has(state.timeRange)) {
      state.historyRecords = [];
      state.historyRange = "";
      state.historyCursor = 0;
      byId("history-status").textContent = "";
      return;
    }
    const fields = trackedFieldSignature();
    if (!fields) return;
    // 范围或字段集变化必须整段重取，否则只按游标增量追加。
    const reload = force || state.historyRange !== state.timeRange ||
      state.historyFields !== fields;
    if (!reload && state.historyCursor === 0) return;
    const afterSequence = reload ? 0 : state.historyCursor;
    try {
      const response = await fetch(
        `/api/metrics/history?range=${encodeURIComponent(state.timeRange)}` +
        `&fields=${encodeURIComponent(fields)}` +
        `&after_sequence=${encodeURIComponent(afterSequence)}`,
        {cache: "no-store"}
      );
      if (!response.ok) throw new Error(`history HTTP ${response.status}`);
      const document = await response.json();
      const fetched = (document.records || []).filter(
        record => record.metrics_source_id === state.sourceId
      );
      state.historyRecords = reload
        ? fetched
        : state.historyRecords.concat(fetched);
      const newest = state.historyRecords[state.historyRecords.length - 1];
      state.historyCursor = newest ? Number(newest.sequence) || 0 : 0;
      state.historyRange = state.timeRange;
      state.historyFields = fields;
      state.historyFetchedAt = Date.now();
      state.historyAvailable = true;
      byId("history-status").textContent = state.historyRecords.length
        ? `历史点 ${formatInteger(state.historyRecords.length)}`
        : "暂无历史数据";
    } catch (error) {
      state.historyAvailable = false;
      state.historyRecords = [];
      state.historyRange = "";
      state.historyCursor = 0;
      byId("history-status").textContent = "历史层不可用，仅显示保留段";
    }
  };
  const ingest = records => {
    if (!Array.isArray(records) || !records.length) return;
    records = records.filter(
      record => record.metrics_source_id === state.sourceId
    );
    if (!records.length) return;
    const bySequence = new Map(
      state.records.map(record => [
        Number(record.sequence),
        record
      ])
    );
    records.forEach(record => {
      const sequence = Number(record.sequence);
      if (sequence > 0) bySequence.set(sequence, record);
    });
    state.records = [...bySequence.values()].sort(
      (left, right) =>
        Number(left.sequence) - Number(right.sequence)
    ).slice(-state.recordLimit);
    const latest = state.records[state.records.length - 1];
    state.cursor = latest
      ? Number(latest.sequence)
      : 0;
  };
  const renderStatus = (status, record) => {
    const actor = record?.actor || {};
    const metricsAvailable = finiteNumber(status?.latest_sequence) !== null;
    const learnerConnected = status?.service === "learner-metrics" && metricsAvailable;
    const stale = status?.stale === true;
    const freshnessUnavailable = status?.stale === null || status?.stale === undefined;
    const serverPresent = Boolean(actor.instance_id);
    const clientConnected = actor.client_session_recent === true;
    const activeModelStep = finiteNumber(actor?.model_identity?.model_step);
    const stagedModelStep = finiteNumber(
      actor?.staged_model_identity?.model_step
    );
    const latestModelStep = finiteNumber(
      record?.model?.latest_available_model_step ??
      record?.model?.latest_model_identity?.model_step ??
      record?.learner?.model_step
    );
    const hasActiveModel = Boolean(actor?.model_identity?.model_lineage_id) &&
      activeModelStep !== null;
    const lifecycleReady = actor.state === "AISERVER_STATE_READY" ||
      (!actor.state && actor.ready === true);
    const projectedServerReady = record?.chain?.server_pod?.ready;
    const serverReady = serverPresent && (
      projectedServerReady === true ||
      (projectedServerReady === undefined && lifecycleReady &&
        !actor.error && clientConnected && hasActiveModel)
    );
    byId("learner-count").textContent = learnerConnected ? "1 / 1" : "— / 1";
    byId("server-count").textContent = !metricsAvailable
      ? "— / 1"
      : serverPresent ? "1 / 1" : "0 / 1";
    setStatus(
      byId("learner-state"),
      !learnerConnected ? "指标不可用" : freshnessUnavailable ? "时效未知" : stale ? "等待指标" : "运行中",
      !learnerConnected ? "bad" : freshnessUnavailable || stale ? "wait" : "ok"
    );
    setStatus(
      byId("server-state"),
      serverReady ? "运行中" :
        stale && actor.instance_id ? "状态过期" :
        actor.error ? "异常" :
        !serverPresent ? "未连接" :
        actor.state === "AISERVER_STATE_DRAINING" ? "正在停止" :
        actor.state === "AISERVER_STATE_STOPPED" ? "已停止" :
        !hasActiveModel ? "模型同步中" :
        !clientConnected ? "等待 Client" : "启动中",
      serverReady ? "ok" : actor.error ? "bad" : "wait"
    );
    let modelSyncText = "等待模型信息";
    if (!serverPresent) {
      modelSyncText = "等待 AIServer 与 Client";
    } else if (!hasActiveModel) {
      modelSyncText = "等待首个可用模型";
    } else if (latestModelStep === null) {
      modelSyncText = `当前 step ${formatInteger(activeModelStep)}`;
    } else if (activeModelStep < latestModelStep) {
      const staged = stagedModelStep !== null &&
        stagedModelStep > activeModelStep
        ? ` · 已暂存 step ${formatInteger(stagedModelStep)}`
        : "";
      modelSyncText = `当前 step ${formatInteger(activeModelStep)}` + staged +
        ` · 最新 step ${formatInteger(latestModelStep)}` +
        ` · 追赶 ${formatInteger(latestModelStep - activeModelStep)}`;
    } else if (activeModelStep === latestModelStep) {
      modelSyncText = `当前 step ${formatInteger(activeModelStep)} · 已同步`;
    } else {
      modelSyncText = `当前 step ${formatInteger(activeModelStep)} · 分发状态待刷新`;
    }
    byId("server-model-sync").textContent = modelSyncText;
    setStatus(
      byId("live-status"),
      !learnerConnected ? "连接失败" :
        freshnessUnavailable ? "指标时效不可用" :
        stale ? "指标已过期" : "实时",
      !learnerConnected ? "bad" : freshnessUnavailable || stale ? "wait" : "ok"
    );
    byId("run-context").textContent =
      `Learner / ${status?.metrics_source_id || "等待训练实例"}`;
    const eventViewStatus = record?.metric_event_views?.status;
    const latestEventUpdate = finiteNumber(
      record?.metric_event_views?.train_updates?.latest?.values?.latest_train_update_sequence
    );
    const eventNote = eventViewStatus === "incomplete"
      ? ` · 历史事件存在缺口${latestEventUpdate === null ? "" :
          `，最新 Update ${formatInteger(latestEventUpdate)}`}`
      : eventViewStatus === "unavailable" ? " · 历史事件不可用" : "";
    byId("stream-status").textContent =
      `指标流：${status?.stream || "—"} · ` +
      `stale=${status?.stale_status || "unavailable"} · ` +
      `sequence ${formatInteger(status?.latest_sequence)}` + eventNote;
  };
  const renderSummary = record => {
    const modelStep = metricValue(record, MODEL_STEP_ID);
    const trainUpdate = metricValue(record, TRAIN_UPDATE_ID);
    const trainedSamples = metricValue(record, TRAINED_SAMPLES_ID);
    const producedSamples = metricValue(record, PRODUCED_SAMPLES_ID);
    byId("model-step").textContent = formatInteger(modelStep);
    byId("train-update").textContent = formatInteger(trainUpdate);
    byId("trained-samples").textContent = formatInteger(trainedSamples);
    byId("produced-samples").textContent =
      formatInteger(producedSamples);
  };

  const poll = async () => {
    if (state.polling) return;
    state.polling = true;
    try {
      const statusResponse = await fetch("/api/status", {cache: "no-store"});
      if (!statusResponse.ok) {
        throw new Error(`status HTTP ${statusResponse.status}`);
      }
      const status = await statusResponse.json();
      const retainedRecordLimit = Number(status.retained_record_limit);
      if (Number.isInteger(retainedRecordLimit) && retainedRecordLimit > 0) {
        state.recordLimit = retainedRecordLimit;
        state.records = state.records.slice(-state.recordLimit);
      }
      const sourceChanged = state.sourceId !== status.metrics_source_id;
      if (sourceChanged) resetStream(status.metrics_source_id);
      await refreshCatalog(sourceChanged || registry.size === 0);
      const metricsResponse = await fetch(
        `/api/metrics?after_sequence=${encodeURIComponent(state.cursor)}` +
        `&window=${EVENT_WINDOW}`,
        {cache: "no-store"}
      );
      if (!metricsResponse.ok) {
        throw new Error(`metrics HTTP ${metricsResponse.status}`);
      }
      const document = await metricsResponse.json();
      ingest(document.records || []);
      if (HISTORY_RANGES.has(state.timeRange)) {
        const historyStale = Date.now() - state.historyFetchedAt > 60000;
        if (state.historyRange !== state.timeRange || historyStale) {
          await loadHistory(true);
        }
      }
      state.status = status;
      const latest = state.records[state.records.length - 1] || {};
      renderStatus(status, latest);
      renderSummary(latest);
      groups.forEach(refreshPanelControls);
      renderAllPanels();
      updateRefreshNote(
        `最近刷新 ${new Date().toLocaleTimeString("zh-CN")}`
      );
    } catch (error) {
      setStatus(byId("live-status"), "连接失败", "bad");
      setStatus(byId("learner-state"), "未连接", "bad");
      setStatus(byId("server-state"), "状态未知", "bad");
      byId("learner-count").textContent = "— / 1";
      byId("server-count").textContent = "— / 1";
      byId("stream-status").textContent = `指标流：${String(error)}`;
      updateRefreshNote(
        `连接中断 ${new Date().toLocaleTimeString("zh-CN")}`
      );
    } finally {
      state.polling = false;
    }
  };

  const populateSelect = (id, options, current) => {
    const select = byId(id);
    options.forEach(option => {
      const element = document.createElement("option");
      element.value = option.key;
      element.textContent = option.label;
      select.appendChild(element);
    });
    select.value = current;
  };
  const applyRefreshInterval = () => {
    if (state.timer !== null) clearInterval(state.timer);
    state.timer = state.refreshMs > 0
      ? setInterval(() => poll(), state.refreshMs)
      : null;
    updateRefreshNote();
  };
  byId("time-range").addEventListener("change", async event => {
    state.timeRange = event.target.value;
    state.domains.clear();
    // 历史档需要等待数据到位后再统一渲染，避免"先空后满"的两段式闪烁。
    if (HISTORY_RANGES.has(state.timeRange)) {
      byId("history-status").textContent = "正在加载历史…";
    }
    await loadHistory(true);
    renderAllPanels();
  });
  byId("refresh-interval").addEventListener("change", event => {
    const option = REFRESH_INTERVALS.find(item => item.key === event.target.value);
    state.refreshMs = option ? option.ms : 5000;
    applyRefreshInterval();
  });
  byId("refresh-now").addEventListener("click", () => poll());
  // viewBox 依赖容器实际宽度，布局变化后需重算，否则字号与刻度会失配。
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (resizeTimer !== null) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resizeTimer = null;
      renderAllPanels();
    }, 160);
  });

  populateSelect("time-range", TIME_RANGES, state.timeRange);
  populateSelect("refresh-interval", REFRESH_INTERVALS, "5s");
  buildPanels();
  poll();
  applyRefreshInterval();
</script>
</body>
</html>
