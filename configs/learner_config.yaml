# Learner owns only task-neutral training, model, transport and monitor settings.
# Maze environment, map, curriculum and Reward values are intentionally absent.

contract:
  package_name: rl-contracts
  package_version: 0.13.0
  source_digest: 1fc3866efe7e5869cc1a7ed4bc86d58f9c1abedafd7012b9f5dae08246ff145d
  artifact_digest: 5ce9dff294e3cab466e2e0f058192f9715530645a41b45851b4d798e19a9a5a7
  platform: linux/arm64
  generator_identity: 0eb73fc2cb675bdb34bf3db9c99dae62a82f93a5e3a72db84dcf3936464729c8

training_semantics:
  training_contract_id: maze.training.v3
  observation_schema:
    schema_id: maze.observation.v3
    schema_version: 1
    canonical_digest: 7cee41136020f3ffc8c6ae799f630d55d0588c6a99ab7f717eac3b3d08aa18b4
  action_schema:
    schema_id: maze.action.v1
    schema_version: 1
    canonical_digest: ce84c564e128f98adcc48fd420ac0df5acea61774a25de8705b602464009cfd8
  reward_schema:
    schema_id: maze.reward.v4
    schema_version: 1
    canonical_digest: ed284084b79413473d5053b6d3f69320d2a4639c81451ba598ca45ac8ce15929
  policy_distribution_schema_id: categorical.logits.v1
  model_architecture_id: maze.mlp-17x64x64.v1
  semantics_digest: 6cd834542f8263135b4bfd069f372ddfdb99334060d305f58b00ce56eea10b4c

policy:
  distribution_schema_id: categorical.logits.v1
  training_sampling: stochastic
  training_temperature: 1.0        # unitless; fixed for behavior log-prob identity
  policy_spec_digest: e1efb81040681fd13fdae439caab09778c8e0b0f6bba16b7808c30fbbb632617

identity:
  model_lineage_id: __FRESH_INTERNAL_LINEAGE_REQUIRED__

training:
  device: cpu
  seed: 0                         # integer RNG seed, >=0
  learning_rate: 0.0003           # Adam step size, (0,1]
  gamma: 0.99                     # reward discount, [0,1]
  gae_lambda: 0.95                # GAE trace decay, [0,1]
  clip_epsilon: 0.2               # PPO policy ratio clip, (0,1]
  value_clip_epsilon: 0.2         # value clip around behavior prediction, (0,1]
  entropy_coef: 0.01              # entropy regularization weight, [0,10]
  value_coef: 0.5                 # value-loss weight, [0,10]
  max_grad_norm: 0.5              # L2 gradient clip, (0,100]
  n_epochs: 4                     # optimizer passes per leased batch, >0
  mini_batch_size: 64             # samples per optimizer mini-batch, >0
  normalize_advantage: true
  max_policy_lag: 2               # accepted behavior-model step lag, >=0

model:
  # null means a fresh random bootstrap. A path or --initial-model selects
  # weight-only warm-start while retaining a new lineage and model_step 0.
  initial_model_path: null
  local_train_dir: ../models/train
  archive_interval_updates: 200
  publication_retention_steps: 101
  obs_dim: 17
  action_dim: 9
  hidden_dim: 64
  bootstrap_seed: 0
  tensor_dtype: float32

sample_pool:
  host: 127.0.0.1
  port: 9100
  train_batch_size: 512            # optimizer target; never split fragments
  max_fragment_samples: 128        # A3 Pool fragment upper bound
  max_train_batch_size: 639        # derived again after startup overrides
  max_sample_age_ms: 120000        # freshness bound at Pool and Learner
  get_timeout_ms: 1000
  lease_timeout_ms: 30000
  finalize_drain_timeout_ms: 30000  # bounded execution tail is trained only after explicit finalize
  finalize_request_path: /tmp/rl-training-finalize
  finalize_complete_path: /tmp/rl-training-finalized
  shutdown_drain_timeout_ms: 20000

model_distributor:
  host: 127.0.0.1
  port: 9200

aiserver_status:
  host: aiserver-dev
  port: 9002
  # null keeps Learner alive until the exact bootstrap model ACK or a signal.
  # A positive value enables an explicit bounded diagnostic timeout.
  initial_model_ack_timeout_sec: null

dashboard:
  enabled: true
  server_port: 9005
  backend: jsonl

log:
  console_level: INFO
  file_level: DEBUG
  log_dir: ../logs
